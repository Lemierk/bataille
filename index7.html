<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duel Royal — Anciens Monstres</title>
<style>
  :root{
    --bg:#0c0d12; --panel:#181a24; --line:#2a2c3a;
    --gold:#c9a86a; --gold-bright:#e9cf8f; --ink:#e8e6df; --dim:#8b8c9a;
    --light:#e8c468; --dark:#8a6bd6; --fire:#d1543b; --water:#3f8bc9;
    --earth:#a3814f; --wind:#5aab7a;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f2efe6; --panel:#fbf9f2; --line:#d8d0ba; --ink:#232016; --dim:#6b6555;
    }
  }
  html{scroll-padding-top: env(safe-area-inset-top, 0px); height:100%;}
  body{
    margin:0; min-height:100%;
    background:radial-gradient(ellipse at 50% -10%, #26283a 0%, var(--bg) 55%) fixed;
    color:var(--ink); font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  }
  *{box-sizing:border-box;}
  .wrap{max-width:1700px; margin:0 auto; padding:10px 14px 50px;}
  header{text-align:center; margin-bottom:6px;}
  h1{
    letter-spacing:.06em; font-weight:600; font-size:clamp(20px,3.4vw,30px);
    margin:0 0 2px; color:var(--gold-bright); text-shadow:0 0 18px rgba(201,168,106,.35);
  }
  header p{margin:0; color:var(--dim); font-size:13px; font-style:italic;}

  .controls{
    display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap;
    margin:8px 0 8px; padding:8px 14px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px;
  }
  button{
    font-family:inherit; font-size:14px; letter-spacing:.03em; cursor:pointer;
    background:linear-gradient(180deg,#2a2c3a,#1b1d27); color:var(--gold-bright);
    border:1px solid var(--gold); border-radius:6px; padding:9px 18px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:hover{box-shadow:0 0 14px rgba(201,168,106,.35);}
  button:active{transform:scale(.97);}
  button:disabled{opacity:.4; cursor:default; box-shadow:none;}
  button:focus-visible{outline:2px solid var(--gold-bright); outline-offset:2px;}
  .controls label{font-size:13px; color:var(--dim); display:flex; gap:8px; align-items:center;}
  input[type=range]{accent-color:var(--gold);}

  #status{
    text-align:center; min-height:20px; margin-bottom:8px; font-size:15px; color:var(--gold-bright);
    font-style:italic;
  }

  /* ---- 2D ARENA ---- */
  #arena-wrap{
    position:relative; width:100%; height:clamp(460px, calc(100vh - 200px), 1100px); height:clamp(460px, calc(100svh - 200px), 1100px); border-radius:14px;
    border:1px solid var(--line); box-shadow: inset 0 0 70px rgba(0,0,0,.65);
    overflow:hidden; touch-action:none; background:#0d0e15;
  }
  /* grass surrounding the platform, à la arène de duel */
  #arena-field{
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(ellipse at 50% 25%, rgba(255,255,255,.06) 0%, transparent 55%),
      repeating-radial-gradient(circle at 22% 30%, rgba(130,180,120,.32) 0 2px, transparent 2px 9px),
      repeating-radial-gradient(circle at 72% 68%, rgba(95,145,95,.28) 0 2px, transparent 2px 11px),
      linear-gradient(160deg, #3c5a37 0%, #24391f 55%, #16240f 100%);
  }
  /* raised metal/stone duel platform where the fight happens */
  #arena-platform{
    position:absolute; inset:7%; border-radius:10px; z-index:1;
    background:
      radial-gradient(circle at 50% 40%, rgba(201,168,106,.08) 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(201,168,106,.16) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(201,168,106,.16) 0 1px, transparent 1px 34px),
      linear-gradient(160deg,#23262f,#111219 75%);
    border:2px solid rgba(201,168,106,.4);
    box-shadow: inset 0 0 40px rgba(0,0,0,.6), 0 10px 24px rgba(0,0,0,.55);
  }
  .pylon{
    position:absolute; width:5px; height:30px; border-radius:3px; z-index:2;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold) 70%, transparent);
    box-shadow:0 0 10px 2px rgba(233,207,143,.55);
  }
  .pylon::after{
    content:""; position:absolute; top:-5px; left:50%; width:7px; height:7px; margin-left:-3.5px;
    border-radius:50%; background:var(--gold-bright); box-shadow:0 0 12px 4px rgba(233,207,143,.75);
  }
  .pylon.tl{top:-14px; left:-2px;} .pylon.tr{top:-14px; right:-2px;}
  .pylon.bl{bottom:-14px; left:-2px;} .pylon.br{bottom:-14px; right:-2px;}
  /* dépose ici ta propre image d'arène (PNG fond transparent) pour remplacer/compléter le CSS ci-dessus */
  #arena-custom-bg{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background-size:cover; background-position:center; background-repeat:no-repeat;
  }
  #fx{position:absolute; inset:0; pointer-events:none; z-index:6;}
  .beam{
    position:absolute; height:3px; border-radius:3px; transform-origin:0 50%;
    background:linear-gradient(90deg, transparent, var(--c,#e9cf8f), transparent);
    filter:drop-shadow(0 0 6px var(--c,#e9cf8f));
    animation:beamFade .3s ease forwards;
  }
  @keyframes beamFade{0%{opacity:0;} 35%{opacity:1;} 100%{opacity:0;}}
  .impact{
    position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--c,#e9cf8f) 40%, transparent 70%);
    animation:impactPop .32s ease forwards;
  }
  @keyframes impactPop{0%{opacity:0; transform:scale(.2);} 40%{opacity:1; transform:scale(1.1);} 100%{opacity:0; transform:scale(1.6);}}

  .token{
    position:absolute; left:0; top:0; width:60px; margin:-30px 0 0 -30px; z-index:3;
    display:flex; flex-direction:column; align-items:center; pointer-events:none;
    will-change:transform;
  }
  .token.dead{opacity:.25; filter:grayscale(1);}
  .token.hit .portrait{animation:hitflash .25s ease;}
  @keyframes hitflash{0%{filter:brightness(2.4);} 100%{filter:brightness(1);}}

  .portrait{
    position:relative; width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background-color:rgba(255,255,255,.04);
    background-image:
      linear-gradient(135deg, rgba(255,255,255,.05) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.05) 50%, rgba(255,255,255,.05) 75%, transparent 75%, transparent);
    background-size:10px 10px;
    border:2px solid var(--atk-color, var(--line));
    box-shadow:0 3px 8px rgba(0,0,0,.5);
  }
  .portrait.has-img{background-size:cover; background-position:center;}
  /* sprites animés (canvas) */
  .sprbox{position:relative; width:52px; height:52px;}
  .sprbox canvas.spr{position:absolute; left:50%; top:-64px; width:128px; height:128px; margin-left:-64px; pointer-events:none;}
  .sprbox .ko{inset:auto; left:50%; top:22px; transform:translateX(-50%); padding:1px 6px; border-radius:4px; background:rgba(10,10,14,.75); z-index:2;}
  .portrait .icon{font-size:24px; line-height:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); transition:transform .12s ease;}
  .token.face-left .icon, .token.face-left .portrait{transform:scaleX(-1);}
  .token.face-left .name{transform:none;}
  .ko{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:9px; letter-spacing:.1em; color:var(--fire); font-weight:700;
    background:rgba(10,10,14,.45); border-radius:50%;
  }
  .hpbar{width:48px; height:4px; border-radius:3px; background:var(--line); margin-top:4px; overflow:hidden;}
  .hpfill{height:100%; background:linear-gradient(90deg,var(--fire),var(--gold)); transition:width .3s ease;}
  .name{
    font-size:9.5px; color:var(--ink); margin-top:2px; max-width:64px; text-align:center;
    text-shadow:0 1px 2px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  #log{
    margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; font-size:13px; color:var(--dim); max-height:140px; overflow-y:auto;
  }
  #log div{padding:2px 0; border-bottom:1px dashed var(--line);}
  #log div:last-child{border-bottom:none;}
  #log .win{color:var(--gold-bright); font-weight:700;}

  /* ---- PARIS ---- */
  #bets{display:grid; grid-template-columns:1fr 1.3fr; gap:14px; margin:16px 0 4px;}
  @media (max-width:820px){ #bets{grid-template-columns:1fr;} }
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0;}
  .panel h2{margin:0 0 10px; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-bright); font-weight:600;}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
  .grow{flex:1 1 200px; min-width:0;}
  input[type=text], input[type=password], input[type=number], select{
    font-family:inherit; font-size:14px; background:var(--bg); color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; max-width:100%;
  }
  input[type=text], input[type=password]{flex:1 1 140px; min-width:0;}
  #online{margin:0 0 8px; padding:8px 14px;} #online summary{cursor:pointer; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-bright); font-weight:600;} #online[open] summary{margin-bottom:8px;} #onState{margin:4px 0;} #onLink{color:var(--gold-bright); word-break:break-all;}
  input[type=number]{width:96px;}
  input:focus-visible, select:focus-visible{outline:2px solid var(--gold-bright); outline-offset:1px;}
  select:disabled, input:disabled{opacity:.5;}
  .hint{font-size:12px; color:var(--dim); font-style:italic;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:5px 10px;
    border:1px solid var(--line); border-radius:20px; background:var(--bg);
  }
  .chip b{color:var(--gold-bright); font-weight:600;}
  button.x{padding:0 4px; border:none; background:none; color:var(--dim); font-size:16px; line-height:1; box-shadow:none;}
  button.x:hover{color:var(--fire); box-shadow:none;}
  button.ghost{background:none; border-color:var(--line); color:var(--dim); font-size:12px; padding:6px 12px;}
  .tablewrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{font-weight:600; color:var(--dim); text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:4px 6px; border-bottom:1px solid var(--line);}
  td{padding:5px 6px; border-bottom:1px dashed var(--line);}
  td.num, th.num{text-align:right; white-space:nowrap;}
  #results{
    margin-top:14px; padding:14px 18px; border:1px solid var(--gold); border-radius:10px;
    background:linear-gradient(180deg, rgba(201,168,106,.12), var(--panel));
  }
  #results h2{margin:0 0 8px; font-size:17px; color:var(--gold-bright); letter-spacing:.03em;}
  #results ul{margin:0; padding-left:18px; font-size:14px; line-height:1.7;}
  #results li.won b:nth-of-type(2){color:#7fd18b;}
  #results li.lost b:nth-of-type(2){color:var(--fire);}
  .tag{font-size:8.5px; color:var(--gold); margin-top:1px; white-space:nowrap; text-shadow:0 1px 2px #000;}
  .tag .bt{color:var(--ink);}

  /* boules de feu */
  .fireball{position:absolute; left:0; top:0; width:0; height:0; pointer-events:none; will-change:transform;}
  .fireball i{position:absolute; left:-20px; top:-20px; width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle, #fff 0%, #fff 16%, var(--c) 46%, transparent 72%);
    filter:drop-shadow(0 0 9px var(--c)); animation:fbPulse .14s linear infinite alternate;}
  .fireball b{position:absolute; right:6px; top:-7px; width:84px; height:14px; border-radius:8px;
    background:linear-gradient(90deg, transparent, var(--c)); opacity:.75; filter:blur(3px);}
  @keyframes fbPulse{from{transform:scale(.82);} to{transform:scale(1.12);}}
  .boom{position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%;
    border:3px solid var(--c,#e9cf8f); box-shadow:0 0 18px var(--c,#e9cf8f), inset 0 0 12px var(--c,#e9cf8f);
    animation:boomRing .5s ease-out forwards;}
  @keyframes boomRing{0%{transform:scale(.3); opacity:1;} 100%{transform:scale(4.2); opacity:0;}}
  /* projectiles des autres types (chaque type a sa propre attaque à distance) */
  .proj{position:absolute; left:0; top:0; width:0; height:0; pointer-events:none; will-change:transform; filter:drop-shadow(0 0 6px var(--c));}
  .proj i,.proj b,.proj u{position:absolute; display:block;}
  .fireball.dark i{background:radial-gradient(circle,#0b0614 0%,#1b0f2e 22%,var(--c) 52%,transparent 74%);}
  .k-orb i{left:-14px; top:-14px; width:28px; height:28px; border-radius:50%; background:radial-gradient(circle,#fff 0,#fff 20%,var(--c) 55%,transparent 74%); animation:fbPulse .16s linear infinite alternate;}
  .k-orb b{right:8px; top:-5px; width:70px; height:10px; border-radius:6px; background:linear-gradient(90deg,transparent,var(--c)); opacity:.55; filter:blur(2px);}
  .k-orb u{left:-34px; top:-12px; width:6px; height:6px; border-radius:50%; background:#fff; box-shadow:0 0 6px var(--c),-18px 12px 0 -1px #fff,-34px -2px 0 -1px var(--c),-50px 9px 0 -2px #fff; animation:twinkle .25s steps(2) infinite;}
  @keyframes twinkle{50%{opacity:.35; transform:translateY(2px);}}
  .k-bolt i{left:-38px; top:-12px; width:76px; height:24px; background:linear-gradient(90deg,transparent,var(--c) 35%,#fff);
    clip-path:polygon(0 50%,14% 28%,28% 62%,44% 14%,58% 70%,74% 24%,100% 50%,76% 80%,60% 38%,44% 92%,28% 40%,14% 74%); animation:flick .08s steps(2) infinite;}
  @keyframes flick{50%{opacity:.6; transform:scaleY(.8);}}
  .k-slash i{left:-8px; top:-30px; width:40px; height:60px; background:radial-gradient(ellipse 100% 100% at 0% 50%,transparent 60%,#fff 64%,var(--c) 76%,transparent 82%);}
  .k-claw i{left:-24px; top:-22px; width:48px; height:44px;
    background:repeating-linear-gradient(115deg,transparent 0 7px,var(--c) 7px 10px,#fff 10px 11px,transparent 11px 18px);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent); mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);}
  .k-water i{left:-13px; top:-13px; width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#fff 0,var(--c) 45%,transparent 74%);
    box-shadow:-22px 4px 0 -6px var(--c),-36px -3px 0 -8px var(--c); animation:fbPulse .2s linear infinite alternate;}
  .k-water b{right:10px; top:-6px; width:56px; height:12px; border-radius:8px; background:linear-gradient(90deg,transparent,var(--c)); opacity:.5; filter:blur(3px);}
  .k-rock i{left:-15px; top:-15px; width:30px; height:30px; background:radial-gradient(circle at 30% 30%,#d9c3a0,#7a6446 70%,#4a3b27);
    clip-path:polygon(10% 30%,40% 4%,82% 14%,96% 56%,70% 96%,24% 90%,2% 60%); animation:spin .35s linear infinite;}
  .k-rock b{right:12px; top:-8px; width:50px; height:16px; border-radius:50%; background:radial-gradient(ellipse,rgba(190,160,120,.55),transparent 70%);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .k-needle i{left:-14px; top:-2px; width:30px; height:4px; background:linear-gradient(90deg,transparent,var(--c) 45%,#fff); clip-path:polygon(0 0,100% 50%,0 100%);}
  .k-needle i:nth-child(1){transform:translateY(-9px) rotate(-7deg);} .k-needle i:nth-child(3){transform:translateY(9px) rotate(7deg);}
  .k-laser b{left:-70px; top:-3px; width:70px; height:6px; border-radius:3px; background:linear-gradient(90deg,transparent,var(--c) 30%,#fff);}
  .k-laser i{left:-8px; top:-8px; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle,#fff 30%,var(--c) 60%,transparent 72%);}
  .k-star i{left:-14px; top:-14px; width:28px; height:28px; background:radial-gradient(circle,#fff 20%,var(--c) 75%);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); animation:spin .5s linear infinite;}
  .k-star b{right:10px; top:-5px; width:60px; height:10px; border-radius:6px; background:linear-gradient(90deg,transparent,var(--c)); opacity:.5; filter:blur(2px);}
  .k-skull i{left:-14px; top:-16px; font:normal 26px/1 sans-serif; animation:wob .3s ease-in-out infinite alternate;}
  .k-skull b{right:10px; top:-6px; width:60px; height:12px; border-radius:8px; background:linear-gradient(90deg,transparent,#7a3cc9); opacity:.5; filter:blur(3px);}
  @keyframes wob{from{transform:rotate(-12deg);} to{transform:rotate(12deg);}}
  @media (prefers-reduced-motion: reduce){ .fireball i,.boom,.proj i,.proj u{animation:none;} }
  @media (prefers-reduced-motion: reduce){
    .token{transition:none;} .beam,.impact,.token.hit .portrait{animation:none;}
  }

  /* ---- CARTES MAGIE / PIÈGE ---- */
  #cards{position:absolute; inset:0; z-index:2; pointer-events:none;}
  .tcard{position:absolute; width:40px; height:58px; margin:-29px 0 0 -20px; border-radius:4px; transform:rotate(-4deg);
    box-shadow:0 2px 6px rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; transition:opacity .6s;}
  .tcard.down{border:2px solid #8a6a3a;
    background:radial-gradient(ellipse at 50% 50%, #7a4220 0 26%, transparent 29%), repeating-linear-gradient(45deg,#3b2414 0 3px,#4a2e19 3px 6px);}
  .tcard.down.img{border:none; background-color:#56301f;}
  .tcard.up{border:2px solid var(--k,#c9a86a); background:linear-gradient(160deg,#2b2d3d,#14151f); animation:cardFlip .45s ease;}
  .tcard.up.magie{--k:#2fb98a;} .tcard.up.piege{--k:#c04f95;}
  .tcard.up.persist{box-shadow:0 0 14px var(--k), 0 2px 6px rgba(0,0,0,.6);}
  .tcard .ci{font-size:22px; line-height:1;}
  .tcard .cimg{width:100%; height:100%; object-fit:cover; display:block; border-radius:2px;}
  .tcard .cl{position:absolute; top:62px; left:50%; transform:translateX(-50%); font-size:9px; white-space:nowrap; color:var(--ink); text-shadow:0 1px 2px #000, 0 0 6px #000;}
  .tcard.gone{opacity:0;}
  @keyframes cardFlip{0%{transform:rotate(-4deg) scaleX(.05);} 100%{transform:rotate(-4deg) scaleX(1);}}
  .pop{position:absolute; transform:translateX(-50%); font-size:13px; font-weight:700; white-space:nowrap; z-index:7;
    text-shadow:0 1px 3px #000, 0 0 8px #000; animation:popUp 1.3s ease-out forwards;}
  @keyframes popUp{0%{opacity:0; margin-top:6px;} 15%{opacity:1;} 100%{opacity:0; margin-top:-34px;}}
  .swords{position:absolute; border:2px solid rgba(255,230,150,.9); border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:22px; letter-spacing:6px; overflow:hidden;
    background:repeating-linear-gradient(90deg, transparent 0 11px, rgba(255,240,180,.5) 11px 13px), radial-gradient(circle, rgba(255,240,170,.28), rgba(255,225,120,.08));
    box-shadow:0 0 18px rgba(255,225,120,.7), inset 0 0 18px rgba(255,235,160,.5);
    animation:swordsIn .35s ease-out, swordsGlow .9s ease-in-out infinite alternate;}
  @keyframes swordsIn{0%{opacity:0; transform:translateY(-30px);} 100%{opacity:1; transform:none;}}
  @keyframes swordsGlow{from{box-shadow:0 0 10px rgba(255,225,120,.5), inset 0 0 10px rgba(255,235,160,.3);} to{box-shadow:0 0 24px rgba(255,225,120,.9), inset 0 0 22px rgba(255,235,160,.6);}}
  .token.frozen canvas.spr, .token.frozen .portrait{filter:sepia(.7) saturate(1.8) brightness(1.2) drop-shadow(0 0 8px #ffe28a);}
  #terrains{position:absolute; inset:0; z-index:2; pointer-events:none;}
  .terr{position:absolute; opacity:0; transition:opacity .9s ease; border-radius:6px; overflow:hidden;
    border:2px solid var(--tc,#fff); box-shadow:0 0 22px var(--tc,#fff), inset 0 0 26px rgba(0,0,0,.35); background:var(--tc,#444);}
  .terr.on{opacity:.62;}
  .terr img{position:absolute; inset:0; width:100%; height:100%; object-fit:fill; display:block;}
  .terr .tn{position:absolute; left:6px; top:4px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#fff; text-shadow:0 1px 3px #000, 0 0 8px #000;}
  .raigeki{position:absolute; z-index:5; pointer-events:none; animation:raiFlash 1.1s ease-out forwards;
    background:linear-gradient(180deg, transparent 0, rgba(255,250,170,.55) 30%, #fff 50%, rgba(255,250,170,.55) 70%, transparent 100%);
    box-shadow:0 0 30px 6px rgba(255,245,150,.85);}
  @keyframes raiFlash{0%{opacity:0; transform:scaleY(.1);} 8%{opacity:1; transform:scaleY(1);} 20%{opacity:.35;} 30%{opacity:1;} 100%{opacity:0; transform:scaleY(.6);}}
  .bhole{position:absolute; border-radius:50%; pointer-events:none; z-index:5; animation:bholeAnim 1.8s ease-in-out forwards;
    background:radial-gradient(circle, #000 0 32%, rgba(40,0,70,.92) 55%, rgba(138,107,214,.35) 80%, transparent 100%);}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="wrap">
  <header>

    <div id="onLogin" class="row">

      <input type="password" id="onCode" placeholder="Code secret" autocomplete="current-password">
      <button id="onLoginBtn">Connexion</button>
    </div>
    <div class="hint" id="onLoginHint">Crée d'abord ton compte sur parier.html, puis passe-le « hôte » (voir le guide).</div>
    <div id="onPanel" hidden>
      <div class="row"><span id="onWho"></span> <button id="onLogoutBtn" class="ghost">Déconnexion</button></div>
      <div class="row">
        <button id="onOpenBtn">Ouvrir les mises</button>
        <button id="onCancelBtn" class="ghost">Annuler la manche (rembourser)</button>

    </div>

    <div id="terrains"></div>

    <div id="fx"></div>
    <div id="showcase"></div>
  </div>

  <div id="results" hidden></div>

  <div id="log"></div>
</div>

<script>
/* MonsterSprite v2 : anime automatiquement N'IMPORTE QUELLE image PNG (fond transparent), sans spritesheet.
   Poses : repos, marche, attaque (mêlée 'melee' ou lancer 'cast'), coup reçu, mort.
   Option fly:true -> le monstre VOLE (lévite au-dessus du sol, penche le corps, bat des "ailes" par déformation de maillage).
     const m = new MonsterSprite(img, { size: 74, faces: 'left', fly: true });
     m.setMoving(bool); m.attack('cast'|'melee'); m.hit(); m.die(); m.update(dt); m.draw(ctx, x, yPieds, dir);
     Option rig:[...] -> MARIONNETTE : pièces (tête, mâchoire, aile, queue...) qui bougent chacune avec leur pivot (voir rig_editor.html).
   m.strikeTime() -> secondes avant l'impact de l'attaque ; m.mouthOffset(dir) -> {dx,dy} de la bouche (relatif aux pieds)
*/
class MonsterSprite {
  constructor(img, opts = {}) {
    this.img = img;
    this.size = opts.size || 96;
    this.faces = opts.faces || 'left';
    this.t = opts.phase ?? Math.random() * 6.28;
    this.state = 'idle'; this.stateT = 0; this.moving = false;
    this.flash = 0; this.strikeDone = false; this.onStrike = null;
    this.baseDur = opts.attackDur || 0.55; this.attackDur = this.baseDur; this.atkKind = 'melee';
    this.alive = true; this.src = null;
    this.boxed = opts.boxed;               // true = image avec fond (carte/carré) -> découpée en ovale
    this.deadAlpha = opts.deadAlpha ?? 0;  // opacité finale du cadavre
    this.fly = !!opts.fly;                 // vole
    this.shadow = opts.shadow !== false;   // ombre au sol intégrée
    this.mouth = opts.mouth || { x: 0.32, y: 0.6 }; // bouche : fraction de largeur vers l'avant / de hauteur depuis les pieds
    this.rig = opts.rig || null; this.rigData = null; this.envMove = 0; this.envAtk = 0;
    const build = () => this._build();
    (img.complete && img.naturalWidth) ? build() : img.addEventListener('load', build);
  }
  _build() {
    const w = this.img.naturalWidth, h = this.img.naturalHeight;
    let sx = 0, sy = 0, sw = w, sh = h;
    try {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.drawImage(this.img, 0, 0);
      const d = g.getImageData(0, 0, w, h).data;
      if (this.boxed === undefined) this.boxed = [0, w - 1, (h - 1) * w, h * w - 1].every(i => d[i * 4 + 3] > 200);
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      if (!this.boxed) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
        if (d[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 >= x0) { sx = x0; sy = y0; sw = x1 - x0 + 1; sh = y1 - y0 + 1; }
    } catch (e) {}
    this.src = { sx, sy, sw, sh };
    const s = document.createElement('canvas'); s.width = sw; s.height = sh;
    const g2 = s.getContext('2d'); g2.drawImage(this.img, sx, sy, sw, sh, 0, 0, sw, sh);
    g2.globalCompositeOperation = 'source-in'; g2.fillStyle = '#fff'; g2.fillRect(0, 0, sw, sh);
    this.sil = s; this.imgW = w; this.imgH = h;
    this._prepRig();
  }
  setRig(rig) { this.rig = rig && rig.length ? rig : null; this._prepRig(); }
  // Pré-calcule, pour chaque sommet du maillage, le poids (0..1) de chaque pièce (polygone + bords adoucis)
  _prepRig() {
    this.rigData = null;
    if (!this.rig || !this.src) return;
    const RG = 14, { sx, sy, sw, sh } = this.src, w = this.imgW, h = this.imgH, M = Math.max(w, h);
    const parts = this.rig.map(p => {
      const poly = (p.poly || []).map(q => [q[0] * w, q[1] * h]);
      if (poly.length < 3) return null;
      const W = new Float32Array((RG + 1) * (RG + 1)), feather = Math.max(0.005, p.feather ?? 0.06) * M;
      for (let j = 0; j <= RG; j++) for (let i = 0; i <= RG; i++) {
        const X = sx + (i / RG) * sw, Y = sy + (j / RG) * sh;
        let inside = false, dmin = 1e9;
        for (let a = 0, b = poly.length - 1; a < poly.length; b = a++) {
          const [x1, y1] = poly[a], [x2, y2] = poly[b];
          if (((y1 > Y) !== (y2 > Y)) && (X < (x2 - x1) * (Y - y1) / (y2 - y1) + x1)) inside = !inside;
          const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy || 1;
          const tt = Math.max(0, Math.min(1, ((X - x1) * dx + (Y - y1) * dy) / L));
          dmin = Math.min(dmin, Math.hypot(X - (x1 + tt * dx), Y - (y1 + tt * dy)));
        }
        let wt = 1;
        if (!inside) { const q = 1 - dmin / feather; wt = q <= 0 ? 0 : q * q * (3 - 2 * q); }
        W[j * (RG + 1) + i] = wt;
      }
      const pv = p.pivot || [0.5, 0.5], px = pv[0] * w, py = pv[1] * h;
      let len = 1; poly.forEach(q => { len = Math.max(len, Math.hypot(q[0] - px, q[1] - py)); });
      return { type: p.type || 'rotate', amp: p.amp ?? 5, speed: p.speed ?? 1, phase: p.phase ?? 0, when: p.when || 'always',
               pu: (px - sx) / sw, pv: (py - sy) / sh, len: len / sw, W };
    }).filter(Boolean);
    this.rigData = { RG, parts };
  }
  setMoving(b) { this.moving = b; }
  attack(kind = 'melee') {
    if (!this.alive || this.state === 'attack') return;
    this.state = 'attack'; this.atkKind = kind; this.attackDur = kind === 'cast' ? 0.8 : this.baseDur;
    this.stateT = 0; this.strikeDone = false;
  }
  strikeTime() { return this.attackDur * (this.atkKind === 'cast' ? 0.5 : 0.42); }
  hit() { if (!this.alive) return; this.flash = 1; if (this.state !== 'attack') { this.state = 'hit'; this.stateT = 0; } }
  die() { if (this.state === 'dead') return; this.alive = false; this.state = 'dead'; this.stateT = 0; this.flash = 1; }
  revive() { this.alive = true; this.state = 'idle'; this.stateT = 0; this.flash = 1; }
  hoverH() {
    if (!this.fly) return 0;
    let h = this.size * 0.34 + this.size * 0.05 * Math.sin(this.t * 2.6);
    if (this.state === 'dead') h *= 1 - Math.min(1, this.stateT / 0.6);
    return h;
  }
  geom() { if (!this.src) return { dw: this.size, dh: this.size }; const k = this.size / Math.max(this.src.sw, this.src.sh); return { dw: this.src.sw * k, dh: this.src.sh * k }; }
  mouthOffset(dir = 1) { const { dw, dh } = this.geom(); return { dx: dir * dw * this.mouth.x, dy: -(this.hoverH() + dh * this.mouth.y) }; }
  bodyOffset() { const { dh } = this.geom(); return -(this.hoverH() + dh * 0.45); }
  update(dt) {
    this.t += dt; this.stateT += dt; this.flash = Math.max(0, this.flash - dt * 4);
    this.envMove += ((this.moving && this.alive ? 1 : 0) - this.envMove) * Math.min(1, dt * 8);
    this.envAtk = this.state === 'attack' ? Math.sin(Math.PI * Math.min(1, this.stateT / this.attackDur)) : 0;
    if (this.state === 'attack') {
      if (!this.strikeDone && this.stateT >= this.strikeTime()) { this.strikeDone = true; this.onStrike && this.onStrike(); }
      if (this.stateT >= this.attackDur) this.state = 'idle';
    } else if (this.state === 'hit' && this.stateT >= 0.3) this.state = 'idle';
  }
  draw(ctx, x, y, dir = 1) {
    if (!this.src) return;
    const { sx, sy, sw, sh } = this.src;
    const { dw, dh } = this.geom();
    const flip = (this.faces === 'left' ? (dir > 0 ? -1 : 1) : (dir > 0 ? 1 : -1));
    let sX = 1, sY = 1, offX = 0, offY = 0, rot = 0, wob = 1, alpha = 1, flap = 7;
    const t = this.t, e = (v) => v * v * (3 - 2 * v), fly = this.fly;
    if (this.state === 'dead') {
      const p = Math.min(1, this.stateT / 0.8);
      rot = dir * 1.35 * e(p); offY = dh * 0.12 * p; wob = 0; flap = 0;
      alpha = 1 - (1 - this.deadAlpha) * Math.min(1, Math.max(0, (this.stateT - 0.7) / 0.6));
    } else if (this.state === 'attack' && this.atkKind === 'cast') {
      const p = this.stateT / this.attackDur; wob = 1.6; flap = 9;
      if (p < 0.5) { const q = e(p / 0.5); offX = -dir * dw * 0.05 * q; sY = 1 + 0.06 * q; sX = 1 + 0.02 * q; rot = -dir * 0.2 * q; offY = -dh * 0.05 * q; }
      else if (p < 0.65) { const q = e((p - 0.5) / 0.15); offX = dir * dw * (-0.05 + 0.1 * q); sY = 1.06 - 0.1 * q; rot = dir * (-0.2 + 0.34 * q); offY = -dh * 0.05 * (1 - q); }
      else { const q = e((p - 0.65) / 0.35); offX = dir * dw * 0.05 * (1 - q); sY = 0.96 + 0.04 * q; rot = dir * 0.14 * (1 - q); }
    } else if (this.state === 'attack') {
      const p = this.stateT / this.attackDur; wob = 2.2; flap = 9;
      if (p < 0.3) { const q = e(p / 0.3); offX = -dir * dw * 0.12 * q; sX = 1 - 0.08 * q; sY = 1 + 0.05 * q; rot = -dir * 0.08 * q; }
      else if (p < 0.5) { const q = e((p - 0.3) / 0.2); offX = dir * dw * (-0.12 + 0.5 * q); sX = 0.92 + 0.2 * q; sY = 1.05 - 0.1 * q; rot = dir * (-0.08 + 0.2 * q); }
      else { const q = e((p - 0.5) / 0.5); offX = dir * dw * 0.38 * (1 - q); sX = 1.12 - 0.12 * q; sY = 0.95 + 0.05 * q; rot = dir * 0.12 * (1 - q); }
    } else if (this.state === 'hit') {
      const q = 1 - this.stateT / 0.3; offX = Math.sin(this.stateT * 70) * dw * 0.05 * q - dir * dw * 0.06 * q; sY = 1 - 0.05 * q; wob = 0.3; flap = 12;
    } else if (this.moving) {
      const b = Math.sin(t * 10);
      if (fly) { rot = dir * 0.22 + Math.sin(t * 5) * 0.03; sY = 1 + 0.02 * b; offY = -Math.sin(t * 10) * dh * 0.02; flap = 11; wob = 1.8; }
      else { offY = -Math.abs(b) * dh * 0.07; sY = 1 + 0.03 * Math.abs(b); sX = 1 - 0.02 * Math.abs(b); rot = dir * 0.05 + b * 0.02; wob = 1.6; }
    } else {
      const b = Math.sin(t * 2.2);
      if (fly) { rot = Math.sin(t * 1.6) * 0.05; sY = 1 + 0.02 * Math.sin(t * 7); offY = -Math.sin(t * 7) * dh * 0.015; flap = 7; }
      else { sY = 1 + 0.03 * b; sX = 1 - 0.015 * b; offY = -Math.abs(b) * 1.5; }
    }
    const hov = this.hoverH();
    if (this.shadow) {
      const k = 1 - Math.min(0.5, hov / (this.size * 0.9));
      ctx.save(); ctx.globalAlpha = 0.28 * alpha * k; ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(x, y, dw * 0.42 * k, dh * 0.07 * k, 0, 0, 6.283); ctx.fill(); ctx.restore();
    }
    ctx.save(); ctx.translate(x + offX, y + offY - hov); ctx.rotate(rot); ctx.scale(flip * sX, sY); ctx.globalAlpha = alpha;
    if (this.boxed) { ctx.beginPath(); ctx.ellipse(0, -dh / 2, dw / 2, dh / 2, 0, 0, 6.283); ctx.clip(); }
    const N = 20, stH = sh / N;
    const strips = (source, a, isSil) => {
      ctx.globalAlpha = alpha * a;
      for (let i = 0; i < N; i++) {
        const wgt = Math.pow(1 - (i + 0.5) / N, 2);
        const dx = Math.sin(t * 2.4 - i * 0.28) * dw * 0.035 * wob * wgt;
        const s0 = (isSil ? 0 : sy) + i * stH, hh = Math.min(stH + 1, sh - i * stH);
        ctx.drawImage(source, isSil ? 0 : sx, s0, sw, hh, -dw / 2 + dx, -dh + i * (dh / N), dw, dh / N + 1);
      }
    };
    const cells = (pts, GX, GY, source, a, isSil) => {
      const cw = sw / GX, ch = sh / GY, cdw = dw / GX, cdh = dh / GY;
      ctx.globalAlpha = alpha * a;
      for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) {
        const k0 = (j * (GX + 1) + i) * 2, k1 = k0 + 2, k2 = ((j + 1) * (GX + 1) + i) * 2;
        ctx.save();
        ctx.transform((pts[k1] - pts[k0]) / cdw, (pts[k1 + 1] - pts[k0 + 1]) / cdw, (pts[k2] - pts[k0]) / cdh, (pts[k2 + 1] - pts[k0 + 1]) / cdh, pts[k0], pts[k0 + 1]);
        const srcX = (isSil ? 0 : sx) + i * cw, srcY = (isSil ? 0 : sy) + j * ch;
        const w2 = Math.min(cw * 1.4, (isSil ? sw : sx + sw) - srcX), h2 = Math.min(ch * 1.4, (isSil ? sh : sy + sh) - srcY); // recouvrement : évite les fentes
        ctx.drawImage(source, srcX, srcY, w2, h2, 0, 0, w2 * (cdw / cw), h2 * (cdh / ch));
        ctx.restore();
      }
    };
    const GX = 10, GY = 14;   // maillage 10x14 : les bords hauts battent comme des ailes
    const pts = this._pts || (this._pts = new Float32Array((GX + 1) * (GY + 1) * 2));
    const mesh = (source, a, isSil) => {
      const ph = t * flap, s = Math.sin(ph);
      for (let j = 0; j <= GY; j++) {
        const v = j / GY, top = Math.pow(1 - v, 2);
        for (let i = 0; i <= GX; i++) {
          const u = i / GX;
          let dx = Math.sin(t * 2.4 - v * 5) * dw * 0.035 * wob * top, dy = 0;
          const edge = Math.max(0, Math.abs(u - 0.5) * 2 - 0.15) / 0.85, wing = edge * Math.max(0, (0.75 - v) / 0.75);
          dy -= s * dh * 0.11 * wing; dx += (u < 0.5 ? 1 : -1) * -s * dw * 0.025 * wing;
          const k = (j * (GX + 1) + i) * 2; pts[k] = -dw / 2 + u * dw + dx; pts[k + 1] = -dh + v * dh + dy;
        }
      }
      cells(pts, GX, GY, source, a, isSil);
    };
    // MARIONNETTE : chaque pièce du rig déplace les sommets proches (poids adoucis) autour de son pivot
    const rd = this.rigData, dead = this.state === 'dead';
    const rpts = rd ? (this._rpts || (this._rpts = new Float32Array((rd.RG + 1) * (rd.RG + 1) * 2))) : null;
    const rigMesh = (source, a, isSil) => {
      const RG = rd.RG, R1 = RG + 1;
      const P = rd.parts.map(pt => {
        const env = pt.when === 'move' ? this.envMove : pt.when === 'idle' ? 1 - this.envMove : pt.when === 'attack' ? this.envAtk : pt.when === 'hit' ? Math.min(1, this.flash) : 1;
        const pose = pt.when === 'attack' || pt.when === 'hit';
        const osc = dead ? 0 : (pose ? 1 : Math.sin(6.2832 * pt.speed * t + 6.2832 * pt.phase)) * env;
        const o = { th: 0, s: 1, tx: 0, ty: 0, wave: 0, pin: 0 };
        const A = pt.amp;
        if (pt.type === 'rotate' || pt.type === 'flap') o.th = A * 0.017453 * osc;
        else if (pt.type === 'wave') o.wave = dead ? 0 : A * 0.017453 * env;
        else if (pt.type === 'bob') o.ty = A * 0.01 * dh * osc;
        else if (pt.type === 'sway') o.tx = A * 0.01 * dw * osc;
        else if (pt.type === 'breathe') o.s = 1 + A * 0.01 * osc;
        else if (pt.type === 'pin') o.pin = Math.min(1, A * 0.01);
        o.px = -dw / 2 + pt.pu * dw; o.py = -dh + pt.pv * dh; o.L = pt.len * dw; o.pt = pt;
        return o;
      });
      for (let j = 0; j <= RG; j++) for (let i = 0; i <= RG; i++) {
        const idx = j * R1 + i, bx = -dw / 2 + (i / RG) * dw, by = -dh + (j / RG) * dh;
        let dx = 0, dy = 0, keep = 1;
        for (const o of P) {
          const wt = o.pt.W[idx]; if (wt < 0.002) continue;
          if (o.pin) { keep *= 1 - wt * o.pin; continue; }
          const rx = bx - o.px, ry = by - o.py;
          let th = o.th;
          if (o.wave) { const r = Math.min(1.4, Math.hypot(rx, ry) / o.L); th = o.wave * Math.sin(6.2832 * o.pt.speed * t + 6.2832 * o.pt.phase - 3 * r) * r; }
          const c = Math.cos(th), s = Math.sin(th);
          dx += wt * ((rx * c - ry * s) * o.s - rx + o.tx);
          dy += wt * ((rx * s + ry * c) * o.s - ry + o.ty);
        }
        const k = idx * 2; rpts[k] = bx + dx * keep; rpts[k + 1] = by + dy * keep;
      }
      cells(rpts, RG, RG, source, a, isSil);
    };
    const paint = rd ? rigMesh : (fly ? mesh : strips);
    paint(this.img, 1, false);
    if (this.flash > 0.01 && this.sil) paint(this.sil, Math.min(1, this.flash) * 0.85, true);
    ctx.restore();
  }
}

/* ---------- chargement tolérant des images de cartes / terrains ----------
   Sur GitHub/Vercel (Linux) « Trappe.png » et « trappe.png » sont deux fichiers différents.
   Si l'image n'est pas trouvée sous le nom écrit dans le code, on essaie d'autres casses / extensions,
   et la console du navigateur (F12) indique le fichier manquant ou le vrai nom à utiliser. */
function imgCandidates(src){
  const m = src.match(/^(.*?)(\.[^./]+)$/);
  if(!m) return [src];
  const base = m[1], ext = m[2], out = [];
  [base, base.toLowerCase(), base.charAt(0).toUpperCase() + base.slice(1).toLowerCase()].forEach(b=>
    [ext, ext.toLowerCase(), ext.toUpperCase(), '.png', '.PNG', '.jpg', '.jpeg', '.webp'].forEach(x=>{ const c = b + x; if(!out.includes(c)) out.push(c); }));
  return out;
}
function smartImg(im, src, onFail){
  const list = imgCandidates(src); let i = 0;
  im.onload = ()=>{ if(i > 0) console.info(`[Duel Royale] « ${src} » trouvée sous le nom « ${list[i]} » : renomme le fichier ou corrige le nom dans le code.`); };
  im.onerror = ()=>{
    i++;
    if(i < list.length) im.src = list[i];
    else { console.warn(`[Duel Royale] image introuvable : « ${src} » (essayé : ${list.join(', ')}). Vérifie qu'elle est bien dans le dépôt, à côté de index.html.`); if(onFail) onFail(); }
  };
  im.src = list[0];
}

  const cols = Math.max(3, Math.round(pw/CELL)), rows = Math.max(3, Math.round(ph/CELL));
  return {x0, y0, pw, ph, cols, rows, cw:pw/cols, ch:ph/rows};
}
function cellOf(g, x, y){
  return {c:Math.min(g.cols-1, Math.max(0, Math.floor((x-g.x0)/g.cw))), r:Math.min(g.rows-1, Math.max(0, Math.floor((y-g.y0)/g.ch)))};
}
function cardCell(g, card){ return {c:Math.min(g.cols-1, Math.floor(card.u*g.cols)), r:Math.min(g.rows-1, Math.floor(card.v*g.rows))}; }

  const fallback = ()=>{ el.innerHTML = `<span class="ci">${d.icon || '🃏'}</span><span class="cl">${d.name}</span>`; };
  if(d.img){
    const im = new Image(); im.className = 'cimg'; im.alt = d.name; smartImg(im, d.img, fallback);
    el.innerHTML = ''; el.appendChild(im);
  } else fallback();
}
function renderCards(){
  const g = gridInfo();
  cards.forEach(card=>{
    const k = cardCell(g, card);
    card.el.style.left = (g.x0 + (k.c+.5)*g.cw) + 'px';
    card.el.style.top  = (g.y0 + (k.r+.5)*g.ch) + 'px';
  });
}
function spawnCards(){
  cardsEl.innerHTML = ''; cards = [];
  const g = gridInfo(), taken = new Set();
  fighters.forEach(f=>{ const k = cellOf(g, f.x, f.y+FOOT_DY); taken.add(k.c+','+k.r); });   // pas sous un monstre au départ
  CARD_DEFS.forEach(def=>{
    for(let n = 0; n < (def.copies || 1); n++){
      let c, r, tries = 0;
      do{ c = Math.random()*g.cols|0; r = Math.random()*g.rows|0; tries++; }while(taken.has(c+','+r) && tries < 300);
      taken.add(c+','+r);
      const el = document.createElement('div');
      const card = {def, u:(c+.5)/g.cols, v:(r+.5)/g.rows, used:false, up:false, hit:new Set(), el};
      cardsEl.appendChild(el);
      paintCard(card, CARDS_FACE_UP);
      cards.push(card);
    }
  });
  renderCards();
}

/* ---------- terrains ---------- */
function terrainRect(g, t){
  const s = Math.min(TERRAIN_SIZE, g.cols, g.rows);
  return {s, c0:Math.max(0, Math.min(g.cols-s, Math.round(t.u0*g.cols))), r0:Math.max(0, Math.min(g.rows-s, Math.round(t.v0*g.rows)))};
}
function renderTerrains(){
  const g = gridInfo();
  terrains.forEach(t=>{
    const R = terrainRect(g, t);
    t.el.style.left = (g.x0 + R.c0*g.cw) + 'px'; t.el.style.top = (g.y0 + R.r0*g.ch) + 'px';
    t.el.style.width = (R.s*g.cw) + 'px'; t.el.style.height = (R.s*g.ch) + 'px';
  });
}
function spawnTerrains(){
  terrEl.innerHTML = ''; terrains = [];
  const g = gridInfo(), s = Math.min(TERRAIN_SIZE, g.cols, g.rows);
  // les zones ne se superposent jamais. On tente plusieurs placements au hasard et on garde celui qui en fait tenir le plus
  // (si la grille est trop petite pour TERRAIN_COUNT zones de TERRAIN_SIZE x TERRAIN_SIZE, il y aura simplement moins de terrains)
  const pool = TERRAIN_DEFS.slice().sort(()=>Math.random()-.5).slice(0, TERRAIN_COUNT);
  const tryLayout = ()=>{
    const spots = [];
    const free = (c, r)=> spots.every(p=> Math.abs(p.c0-c) >= s || Math.abs(p.r0-r) >= s);
    for(let n = 0; n < pool.length; n++){
      let spot = null;
      for(let i = 0; i < 60 && !spot; i++){
        const c = Math.random()*(g.cols-s+1)|0, r = Math.random()*(g.rows-s+1)|0;
        if(free(c, r)) spot = {c0:c, r0:r};
      }
      if(!spot) break;
      spots.push(spot);
    }
    return spots;
  };
  let spots = [];
  for(let t = 0; t < 60 && spots.length < pool.length; t++){ const l = tryLayout(); if(l.length > spots.length) spots = l; }
  pool.slice(0, spots.length).forEach((def, idx)=>{
    const c0 = spots[idx].c0, r0 = spots[idx].r0;
    const el = document.createElement('div');
    el.className = 'terr'; el.style.setProperty('--tc', def.color);
    const im = new Image(); im.alt = ''; smartImg(im, def.img, ()=>im.remove()); el.appendChild(im);
    const tag = document.createElement('span'); tag.className = 'tn'; tag.textContent = def.name; el.appendChild(tag);
    terrEl.appendChild(el);
    terrains.push({def, u0:c0/g.cols, v0:r0/g.rows, revealed:false, el});
  });
  renderTerrains();
}
const inTerrain = (g, R, k)=> k.c >= R.c0 && k.c < R.c0+R.s && k.r >= R.r0 && k.r < R.r0+R.s;

/* ---------- utilitaires d'effets ---------- */
function popText(x, y, text, color){
  const d = document.createElement('div');
  d.className = 'pop'; d.textContent = text; d.style.left = x+'px'; d.style.top = y+'px'; d.style.color = color;
  fx.appendChild(d); setTimeout(()=>d.remove(), 1300);
}
function refreshStats(f){
  const el = f.el.querySelector('.mods'); if(!el) return;
  const a = effAtk(f), d = effDef(f);
  const cls = (v, v0)=> v > v0 ? 'up' : v < v0 ? 'down' : '';
  el.innerHTML = (a !== f.atk0 || d !== f.def0 || f.chargeBonus)
    ? `<span class="${cls(a,f.atk0)}">ATK ${a}</span> <span class="${cls(d,f.def0)}">DEF ${d}</span>` + (f.chargeBonus ? ` <span class="up">⚡+${f.chargeBonus}</span>` : '')
    : '';

function addFx(cls, x, y, w, h, ms){
  const e = document.createElement('div'); e.className = cls;

// détruit un monstre (hors combat) : mêmes visuels qu'une élimination normale
function koFighter(f, why){
  if(!f.alive) return;
  f.hp = 0; f.alive = false; f.dyingVisual = false; f.chargeBonus = 0;
  logLine(`💥 ${f.name} est détruit par ${why} !`);

  if(f.spr){ f.spr.die(); f.glitchUntil = performance.now() + 240; }
  const box = f.el.querySelector('.sprbox');

  else { const por = f.el.querySelector('.portrait'); if(por) por.innerHTML = '<div class="ko">K.O.</div>' + `<span class="icon">${TYPE_ICON[f.type] || '❖'}</span>`; }

function reviveFighter(o, x, y){
  const b = platformBounds();
  o.alive = true; o.hp = o.maxHp; o.atk = o.atk0; o.def = o.def0; o.chargeBonus = 0; o.frozenUntil = 0; o.tMod = 0;
  o.cooldown = 600; o.moving = false; o.dyingVisual = false;
  o.x = Math.max(b.minX, Math.min(b.maxX, x)); o.y = Math.max(b.minY, Math.min(b.maxY, y));
  cards.forEach(c=>c.hit.delete(o.id));
  if(o.spr) o.spr.revive();
  o.glitchUntil = performance.now() + 400;
  o.el.classList.remove('dead', 'hit', 'revive-in'); void o.el.offsetWidth; o.el.classList.add('revive-in'); setTimeout(()=>o.el.classList.remove('revive-in'), 1100);
  const ko = o.el.querySelector('.ko'); if(ko) ko.remove();
  const hp = o.el.querySelector('.hpfill'); if(hp) hp.style.width = '100%';
  refreshStats(o);
}

/* ---------- effets des magies ---------- */
function effTyphon(card, g){
  const pool = cards.filter(c=>c !== card && !c.used);
  if(!pool.length){ logLine('🌪️ Typhon : plus aucune carte à détruire.'); return; }

function flashScreen(color, ms){
  const d = document.createElement('div'); d.className = 'sflash'; d.style.background = color; d.style.animationDuration = ms+'ms';
  fx.appendChild(d); setTimeout(()=>d.remove(), ms+50);
}
function shake(ms){ arenaWrap.classList.add('quake'); clearTimeout(shake.t); shake.t = setTimeout(()=>arenaWrap.classList.remove('quake'), ms); }
function lightningPath(x1, y1, x2, y2, seg, jit){
  const pts = [[x1, y1]];
  for(let i = 1; i < seg; i++){ const t = i/seg; pts.push([x1 + (x2-x1)*t + (Math.random()-.5)*jit, y1 + (y2-y1)*t + (Math.random()-.5)*jit]); }
  pts.push([x2, y2]);
  return pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
}
function addLightning(paths, ms){

  }));

}

/* ---------- mise en scène des grosses cartes : carte affichée en grand + ralenti, puis l'effet ---------- */
const SLOWMO_FACTOR = 0.3;        // vitesse du jeu pendant l'affichage (1 = normale)
const SLOWMO_MS = 1800;           // durée du ralenti (ms réelles)
const SHOWCASE_DELAY = 700;       // délai entre l'apparition de la carte et le déclenchement de l'effet (ms)
let slowUntil = 0, battleId = 0, showTimer = null;
const showEl = document.getElementById('showcase');
const speedFactor = ()=> performance.now() < slowUntil ? SLOWMO_FACTOR : 1;
function showcase(d, run){
  slowUntil = Math.max(slowUntil, performance.now() + SLOWMO_MS);
  showEl.innerHTML = ''; showEl.classList.add('on');
  const box = document.createElement('div'); box.className = 'sc ' + d.kind;
  const fallback = ()=>{ box.innerHTML = `<span class="big">${d.icon || '🃏'}</span><span class="nm">${d.name}</span>`; };
  if(d.img){ const im = new Image(); im.alt = d.name; smartImg(im, d.img, fallback); box.appendChild(im); } else fallback();
  showEl.appendChild(box);
  clearTimeout(showTimer);
  showTimer = setTimeout(()=>{ box.classList.add('out'); showEl.classList.remove('on'); setTimeout(()=>box.remove(), 550); }, SLOWMO_MS - 350);
  const id = battleId;
  setTimeout(()=>{ if(id === battleId) run(); }, SHOWCASE_DELAY);
}

/* ---------- effets des grosses magies ---------- */
function effRaigeki(g, cr){
  const y = g.y0 + (cr+.5)*g.ch;
  flashScreen('rgba(255,255,255,.65)', 500); shake(550);
  addFx('raigeki', g.x0, g.y0 + cr*g.ch, g.pw, g.ch, 1100);
  const paths = [lightningPath(g.x0, y, g.x0+g.pw, y, 18, 26), lightningPath(g.x0, y, g.x0+g.pw, y, 12, 36)];
  const victims = fighters.filter(o=>o.alive && cellOf(g, o.x, o.y+FOOT_DY).r === cr);
  victims.forEach(o=>{
    paths.push(lightningPath(o.x + (Math.random()-.5)*20, 0, o.x, o.y+FOOT_DY, 9, 32));
    spawnBoom(o.x, o.y+FOOT_DY, '#fff6a0'); koFighter(o, 'Raigeki');
  });
  addLightning(paths, 900);
  logLine(`⚡ Raigeki frappe toute la ligne : ${victims.length} monstre(s) détruit(s).`);
}
function effBlackHole(g, cx, cy, rCells){
  const R = rCells * (g.cw + g.ch) / 2;
  addFx('bhole', cx-R, cy-R, 2*R, 2*R, 1800);
  let n = 0;
  fighters.forEach(o=>{ if(o.alive && Math.hypot(o.x-cx, (o.y+FOOT_DY)-cy) <= R){ koFighter(o, 'le Trou noir'); n++; } });
  logLine(`⚫ Trou noir (rayon ${rCells} cases) : ${n} monstre(s) aspiré(s).`);
}
function effHinotama(g, m){
  const hit = new Set(), id = battleId;
  flashScreen('rgba(255,100,30,.4)', 1200); shake(m.duration + 350);
  for(let i = 0; i < m.count; i++){
    const px = g.x0 + Math.random()*g.pw, py = g.y0 + Math.random()*g.ph, t0 = i * (m.duration / m.count);
    timers.push({at:gameClock + t0, fn:()=>{
      const el = document.createElement('div'); el.className = 'meteor'; el.style.left = px+'px'; el.style.top = py+'px';
      fx.appendChild(el);
      if(el.animate) el.animate([{transform:'translate(-140px,-320px)'}, {transform:'translate(0,0)'}], {duration:350, easing:'ease-in', fill:'forwards'});
      setTimeout(()=>el.remove(), 380);
    }});
    timers.push({at:gameClock + t0 + 350, fn:()=>{
      if(id !== battleId) return;
      spawnBoom(px, py, '#ff6a3d'); spawnBoom(px, py, '#ffd27a');
      addFx('scorch', px-40, py-40, 80, 80, 3300);
      fighters.forEach(o=>{
        if(!o.alive || hit.has(o.id) || Math.hypot(o.x-px, (o.y+10)-py) > m.radius) return;
        hit.add(o.id); o.atk = Math.max(0, o.atk + m.atk); refreshStats(o);
        popText(o.x, o.y-58, `☄️ ATK ${m.atk}`, '#ff7a5c');
        logLine(`☄️ ${o.name} est touché par une météorite : ATK ${m.atk}.`);
      });
    }});
  }
  logLine('☄️ Hinotama : une pluie de météorites s\'abat sur l\'arène !');
}
function effReborn(cx, cy){
  const pool = fighters.filter(o=>!o.alive && !o.dyingVisual);
  if(!pool.length){ logLine('⚰️ Monster Reborn : aucun monstre au cimetière.'); popText(cx, cy-50, '⚰️ Cimetière vide', '#c9c9d6'); return; }
  const o = pool[Math.random()*pool.length|0];
  // colonne de lumière + anneaux + étincelles à l'endroit de la renaissance
  flashScreen('rgba(190,255,200,.2)', 800);
  addFx('pillar', cx-34, cy-230, 68, 230, 1700);
  addFx('rring', cx-50, cy-18, 100, 36, 1500);
  addFx('rring r2', cx-50, cy-18, 100, 36, 1700);
  for(let i = 0; i < 14; i++){
    const s = addFx('spark', cx + (Math.random()-.5)*64, cy - Math.random()*18, 6, 6, 1900);

// Shield & Sword : échange ATK et DEF de tous les monstres vivants, en vague de gauche à droite
function effSwap(){
  const W = arenaWrap.clientWidth, id = battleId, alive = fighters.filter(o=>o.alive);
  flashScreen('rgba(120,170,255,.25)', 800);
  const wave = addFx('swapwave', 0, 0, 150, arenaWrap.clientHeight, 1300);

  logLine(`🛡️ Shield & Sword : l'ATK et la DEF de ${alive.length} monstre(s) sont échangées.`);

function triggerCard(card, f, g, cc, cr){
  const d = card.def, e = d.effect;
  const cx = g.x0 + (cc+.5)*g.cw, cy = g.y0 + (cr+.5)*g.ch;
  card.hit.add(f.id);
  paintCard(card, true);
  logLine(`🃏 ${f.name} déclenche « ${d.name} » : ${d.desc}.`);
  const bad = e.atk < 0 || e.def < 0 || e.hpPct < 0 || e.atkMul || e.raigeki || e.blackHole || e.meteors || e.destroyCards;
  popText(f.x, f.y-58, `${d.icon || '🃏'} ${d.pop}`, (e.freeze || e.swapStats) ? '#ffe28a' : bad ? '#ff7a5c' : '#7fd18b');

  if(e.atk || e.def){
    f.atk = Math.max(0, f.atk + (e.atk || 0));
    f.def = Math.max(0, f.def + (e.def || 0));
  }
  if(e.atkMul) f.atk = Math.round(f.atk * e.atkMul);
  if(e.hpPct){                              // perte de PV en % des PV max (jamais mortelle : il reste au moins 1 PV)
    const loss = Math.min(f.hp - 1, Math.round(f.maxHp * -e.hpPct));
    if(loss > 0){
      f.hp -= loss;
      const bar = f.el.querySelector('.hpfill'); if(bar) bar.style.width = (f.hp / f.maxHp * 100).toFixed(0) + '%';
      logLine(`❤️ ${f.name} perd ${loss} PV (${Math.round(-e.hpPct*100)} % de ses PV max).`);
    }
  }
  if(e.nextAtk) f.chargeBonus = (f.chargeBonus || 0) + e.nextAtk;
  refreshStats(f);

  if(e.freeze){
    const R = e.radius ?? 1; let n = 0;
    fighters.forEach(o=>{
      if(!o.alive) return;
      const k = cellOf(g, o.x, o.y+FOOT_DY);
      if(Math.abs(k.c-cc) <= R && Math.abs(k.r-cr) <= R){ o.frozenUntil = gameClock + e.freeze; n++; }
    });
    const c0 = Math.max(0, cc-R), c1 = Math.min(g.cols-1, cc+R), r0 = Math.max(0, cr-R), r1 = Math.min(g.rows-1, cr+R);
    const z = addFx('swords', g.x0 + c0*g.cw, g.y0 + r0*g.ch, (c1-c0+1)*g.cw, (r1-r0+1)*g.ch, e.freeze*20);
    z.textContent = '🗡️🗡️🗡️';
    zones.push({until: gameClock + e.freeze, el: z});
    logLine(`🗡️ ${n} monstre(s) bloqué(s) pendant ${e.freeze/1000} s.`);
  }
  if(e.destroyCards) effTyphon(card, g);
  const heavy = ()=>{                       // grosses magies : lancées après l'affichage de la carte (si showcase:true)
    if(e.raigeki) effRaigeki(g, cr);
    if(e.blackHole) effBlackHole(g, cx, cy, e.blackHole.radius);
    if(e.meteors) effHinotama(g, e.meteors);
    if(e.reborn) effReborn(cx, cy);
    if(e.swapStats) effSwap();
  };
  if(d.showcase && (e.raigeki || e.blackHole || e.meteors || e.reborn || e.swapStats)) showcase(d, heavy); else heavy();

  if(!d.persistent){                      // carte à usage unique : elle s'efface après quelques secondes
    card.used = true;
    setTimeout(()=>{ card.el.classList.add('gone'); setTimeout(()=>card.el.remove(), 700); }, 2200);
  }
}

// appelé à chaque image de la bataille : minuteries, blocages, terrains, détection des monstres sur une carte
function tickCards(){
  const g = gridInfo();
  const due = timers.filter(x=>gameClock >= x.at);
  if(due.length){ timers = timers.filter(x=>gameClock < x.at); due.forEach(x=>x.fn()); }
  zones = zones.filter(z=>{ if(gameClock >= z.until){ z.el.remove(); return false; } return true; });
  fighters.forEach(f=>f.el.classList.toggle('frozen', f.alive && f.frozenUntil > gameClock));

  // terrains : révélation à la 1re entrée, puis bonus/malus tant que le monstre est dans la zone
  const rects = terrains.map(t=>terrainRect(g, t));
  fighters.forEach(f=>{
    if(!f.alive){ if(f.tMod){ f.tMod = 0; refreshStats(f); } return; }
    const k = cellOf(g, f.x, f.y+FOOT_DY);
    let mod = 0; const names = [];
    terrains.forEach((t, i)=>{
      if(!inTerrain(g, rects[i], k)) return;
      if(!t.revealed){
        t.revealed = true; t.el.classList.add('on');
        const d = t.def;
        logLine(`🌍 ${f.name} entre sur « ${d.name} » : +${TERRAIN_BONUS} ATK/DEF pour ${d.plus.join(', ')}` + (d.minus.length ? ` ; −${TERRAIN_BONUS} pour ${d.minus.join(', ')}` : '') + '.');
      }
      if(t.def.plus.includes(f.type)){ mod += TERRAIN_BONUS; names.push(t.def.name); }
      else if(t.def.minus.includes(f.type)){ mod -= TERRAIN_BONUS; names.push(t.def.name); }
    });
    if(mod !== (f.tMod || 0)){
      f.tMod = mod; refreshStats(f);
      if(mod) popText(f.x, f.y-58, `${names.join(' + ')} ${mod > 0 ? '+' : '−'}${Math.abs(mod)} ATK/DEF`, mod > 0 ? '#7fd18b' : '#ff7a5c');
    }
  });

  for(const card of cards){
    if(card.used) continue;
    const k = cardCell(g, card);
    for(const f of fighters){
      if(!f.alive || card.hit.has(f.id)) continue;
      const m = cellOf(g, f.x, f.y+FOOT_DY);
      if(m.c === k.c && m.r === k.r){ triggerCard(card, f, g, k.c, k.r); if(card.used) break; }
    }
  }
}
