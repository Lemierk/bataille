<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duel Royal — Anciens Monstres</title>
<style>
  :root{
    --bg:#0c0d12; --panel:#181a24; --line:#2a2c3a;
    --gold:#c9a86a; --gold-bright:#e9cf8f; --ink:#e8e6df; --dim:#8b8c9a;
    --light:#e8c468; --dark:#8a6bd6; --fire:#d1543b; --water:#3f8bc9;
    --earth:#a3814f; --wind:#5aab7a;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f2efe6; --panel:#fbf9f2; --line:#d8d0ba; --ink:#232016; --dim:#6b6555;
    }
  }
  html{scroll-padding-top: env(safe-area-inset-top, 0px); height:100%;}
  body{
    margin:0; min-height:100%;
    background:radial-gradient(ellipse at 50% -10%, #26283a 0%, var(--bg) 55%) fixed;
    color:var(--ink); font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  }
  *{box-sizing:border-box;}
  .wrap{max-width:1700px; margin:0 auto; padding:10px 14px 50px;}
  header{text-align:center; margin-bottom:6px;}
  h1{
    letter-spacing:.06em; font-weight:600; font-size:clamp(20px,3.4vw,30px);
    margin:0 0 2px; color:var(--gold-bright); text-shadow:0 0 18px rgba(201,168,106,.35);
  }
  header p{margin:0; color:var(--dim); font-size:13px; font-style:italic;}

  .controls{
    display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap;
    margin:8px 0 8px; padding:8px 14px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px;
  }
  button{
    font-family:inherit; font-size:14px; letter-spacing:.03em; cursor:pointer;
    background:linear-gradient(180deg,#2a2c3a,#1b1d27); color:var(--gold-bright);
    border:1px solid var(--gold); border-radius:6px; padding:9px 18px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:hover{box-shadow:0 0 14px rgba(201,168,106,.35);}
  button:active{transform:scale(.97);}
  button:disabled{opacity:.4; cursor:default; box-shadow:none;}
  button:focus-visible{outline:2px solid var(--gold-bright); outline-offset:2px;}
  .controls label{font-size:13px; color:var(--dim); display:flex; gap:8px; align-items:center;}
  input[type=range]{accent-color:var(--gold);}

  #status{
    text-align:center; min-height:20px; margin-bottom:8px; font-size:15px; color:var(--gold-bright);
    font-style:italic;
  }

  /* ---- 2D ARENA ---- */
  #arena-wrap{
    position:relative; width:100%; height:clamp(460px, calc(100vh - 200px), 1100px); height:clamp(460px, calc(100svh - 200px), 1100px); border-radius:14px;
    border:1px solid var(--line); box-shadow: inset 0 0 70px rgba(0,0,0,.65);
    overflow:hidden; touch-action:none; background:#0d0e15;
  }
  /* grass surrounding the platform, à la arène de duel */
  #arena-field{
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(ellipse at 50% 25%, rgba(255,255,255,.06) 0%, transparent 55%),
      repeating-radial-gradient(circle at 22% 30%, rgba(130,180,120,.32) 0 2px, transparent 2px 9px),
      repeating-radial-gradient(circle at 72% 68%, rgba(95,145,95,.28) 0 2px, transparent 2px 11px),
      linear-gradient(160deg, #3c5a37 0%, #24391f 55%, #16240f 100%);
  }
  /* raised metal/stone duel platform where the fight happens */
  #arena-platform{
    position:absolute; inset:7%; border-radius:10px; z-index:1;
    background:
      radial-gradient(circle at 50% 40%, rgba(201,168,106,.08) 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(201,168,106,.16) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(201,168,106,.16) 0 1px, transparent 1px 34px),
      linear-gradient(160deg,#23262f,#111219 75%);
    border:2px solid rgba(201,168,106,.4);
    box-shadow: inset 0 0 40px rgba(0,0,0,.6), 0 10px 24px rgba(0,0,0,.55);
  }
  .pylon{
    position:absolute; width:5px; height:30px; border-radius:3px; z-index:2;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold) 70%, transparent);
    box-shadow:0 0 10px 2px rgba(233,207,143,.55);
  }
  .pylon::after{
    content:""; position:absolute; top:-5px; left:50%; width:7px; height:7px; margin-left:-3.5px;
    border-radius:50%; background:var(--gold-bright); box-shadow:0 0 12px 4px rgba(233,207,143,.75);
  }
  .pylon.tl{top:-14px; left:-2px;} .pylon.tr{top:-14px; right:-2px;}
  .pylon.bl{bottom:-14px; left:-2px;} .pylon.br{bottom:-14px; right:-2px;}
  /* dépose ici ta propre image d'arène (PNG fond transparent) pour remplacer/compléter le CSS ci-dessus */
  #arena-custom-bg{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background-size:cover; background-position:center; background-repeat:no-repeat;
  }
  #fx{position:absolute; inset:0; pointer-events:none; z-index:6;}
  .beam{
    position:absolute; height:3px; border-radius:3px; transform-origin:0 50%;
    background:linear-gradient(90deg, transparent, var(--c,#e9cf8f), transparent);
    filter:drop-shadow(0 0 6px var(--c,#e9cf8f));
    animation:beamFade .3s ease forwards;
  }
  @keyframes beamFade{0%{opacity:0;} 35%{opacity:1;} 100%{opacity:0;}}
  .impact{
    position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--c,#e9cf8f) 40%, transparent 70%);
    animation:impactPop .32s ease forwards;
  }
  @keyframes impactPop{0%{opacity:0; transform:scale(.2);} 40%{opacity:1; transform:scale(1.1);} 100%{opacity:0; transform:scale(1.6);}}

  .token{
    position:absolute; left:0; top:0; width:60px; margin:-30px 0 0 -30px; z-index:3;
    display:flex; flex-direction:column; align-items:center; pointer-events:none;
    will-change:transform;
  }
  .token.dead{opacity:.25; filter:grayscale(1);}
  .token.hit .portrait{animation:hitflash .25s ease;}
  @keyframes hitflash{0%{filter:brightness(2.4);} 100%{filter:brightness(1);}}

  .portrait{
    position:relative; width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background-color:rgba(255,255,255,.04);
    background-image:
      linear-gradient(135deg, rgba(255,255,255,.05) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.05) 50%, rgba(255,255,255,.05) 75%, transparent 75%, transparent);
    background-size:10px 10px;
    border:2px solid var(--atk-color, var(--line));
    box-shadow:0 3px 8px rgba(0,0,0,.5);
  }
  .portrait.has-img{background-size:cover; background-position:center;}
  /* sprites animés (canvas) */
  .sprbox{position:relative; width:52px; height:52px;}
  .sprbox canvas.spr{position:absolute; left:50%; top:-64px; width:128px; height:128px; margin-left:-64px; pointer-events:none;}
  .sprbox .ko{inset:auto; left:50%; top:22px; transform:translateX(-50%); padding:1px 6px; border-radius:4px; background:rgba(10,10,14,.75); z-index:2;}
  .portrait .icon{font-size:24px; line-height:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); transition:transform .12s ease;}
  .token.face-left .icon, .token.face-left .portrait{transform:scaleX(-1);}
  .token.face-left .name{transform:none;}
  .ko{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:9px; letter-spacing:.1em; color:var(--fire); font-weight:700;
    background:rgba(10,10,14,.45); border-radius:50%;
  }
  .hpbar{width:48px; height:4px; border-radius:3px; background:var(--line); margin-top:4px; overflow:hidden;}
  .hpfill{height:100%; background:linear-gradient(90deg,var(--fire),var(--gold)); transition:width .3s ease;}
  .name{
    font-size:9.5px; color:var(--ink); margin-top:2px; max-width:64px; text-align:center;
    text-shadow:0 1px 2px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  #log{
    margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; font-size:13px; color:var(--dim); max-height:140px; overflow-y:auto;
  }
  #log div{padding:2px 0; border-bottom:1px dashed var(--line);}
  #log div:last-child{border-bottom:none;}
  #log .win{color:var(--gold-bright); font-weight:700;}

  /* ---- PARIS ---- */
  #bets{display:grid; grid-template-columns:1fr 1.3fr; gap:14px; margin:16px 0 4px;}
  @media (max-width:820px){ #bets{grid-template-columns:1fr;} }
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0;}
  .panel h2{margin:0 0 10px; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-bright); font-weight:600;}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
  .grow{flex:1 1 200px; min-width:0;}
  input[type=text], input[type=password], input[type=number], select{
    font-family:inherit; font-size:14px; background:var(--bg); color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; max-width:100%;
  }
  input[type=text], input[type=password]{flex:1 1 140px; min-width:0;}
  #online{margin:0 0 8px; padding:8px 14px;} #online summary{cursor:pointer; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-bright); font-weight:600;} #online[open] summary{margin-bottom:8px;} #onState{margin:4px 0;} #onLink{color:var(--gold-bright); word-break:break-all;}
  input[type=number]{width:96px;}
  input:focus-visible, select:focus-visible{outline:2px solid var(--gold-bright); outline-offset:1px;}
  select:disabled, input:disabled{opacity:.5;}
  .hint{font-size:12px; color:var(--dim); font-style:italic;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:5px 10px;
    border:1px solid var(--line); border-radius:20px; background:var(--bg);
  }
  .chip b{color:var(--gold-bright); font-weight:600;}
  button.x{padding:0 4px; border:none; background:none; color:var(--dim); font-size:16px; line-height:1; box-shadow:none;}
  button.x:hover{color:var(--fire); box-shadow:none;}
  button.ghost{background:none; border-color:var(--line); color:var(--dim); font-size:12px; padding:6px 12px;}
  .tablewrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{font-weight:600; color:var(--dim); text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:4px 6px; border-bottom:1px solid var(--line);}
  td{padding:5px 6px; border-bottom:1px dashed var(--line);}
  td.num, th.num{text-align:right; white-space:nowrap;}
  #results{
    margin-top:14px; padding:14px 18px; border:1px solid var(--gold); border-radius:10px;
    background:linear-gradient(180deg, rgba(201,168,106,.12), var(--panel));
  }
  #results h2{margin:0 0 8px; font-size:17px; color:var(--gold-bright); letter-spacing:.03em;}
  #results ul{margin:0; padding-left:18px; font-size:14px; line-height:1.7;}
  #results li.won b:nth-of-type(2){color:#7fd18b;}
  #results li.lost b:nth-of-type(2){color:var(--fire);}
  .tag{font-size:8.5px; color:var(--gold); margin-top:1px; white-space:nowrap; text-shadow:0 1px 2px #000;}
  .tag .bt{color:var(--ink);}

  /* boules de feu */
  .fireball{position:absolute; left:0; top:0; width:0; height:0; pointer-events:none; will-change:transform;}
  .fireball i{position:absolute; left:-20px; top:-20px; width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle, #fff 0%, #fff 16%, var(--c) 46%, transparent 72%);
    filter:drop-shadow(0 0 9px var(--c)); animation:fbPulse .14s linear infinite alternate;}
  .fireball b{position:absolute; right:6px; top:-7px; width:84px; height:14px; border-radius:8px;
    background:linear-gradient(90deg, transparent, var(--c)); opacity:.75; filter:blur(3px);}
  @keyframes fbPulse{from{transform:scale(.82);} to{transform:scale(1.12);}}
  .boom{position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%;
    border:3px solid var(--c,#e9cf8f); box-shadow:0 0 18px var(--c,#e9cf8f), inset 0 0 12px var(--c,#e9cf8f);
    animation:boomRing .5s ease-out forwards;}
  @keyframes boomRing{0%{transform:scale(.3); opacity:1;} 100%{transform:scale(4.2); opacity:0;}}
  /* projectiles des autres types (chaque type a sa propre attaque à distance) */
  .proj{position:absolute; left:0; top:0; width:0; height:0; pointer-events:none; will-change:transform; filter:drop-shadow(0 0 6px var(--c));}
  .proj i,.proj b,.proj u{position:absolute; display:block;}
  .fireball.dark i{background:radial-gradient(circle,#0b0614 0%,#1b0f2e 22%,var(--c) 52%,transparent 74%);}
  .k-orb i{left:-14px; top:-14px; width:28px; height:28px; border-radius:50%; background:radial-gradient(circle,#fff 0,#fff 20%,var(--c) 55%,transparent 74%); animation:fbPulse .16s linear infinite alternate;}
  .k-orb b{right:8px; top:-5px; width:70px; height:10px; border-radius:6px; background:linear-gradient(90deg,transparent,var(--c)); opacity:.55; filter:blur(2px);}
  .k-orb u{left:-34px; top:-12px; width:6px; height:6px; border-radius:50%; background:#fff; box-shadow:0 0 6px var(--c),-18px 12px 0 -1px #fff,-34px -2px 0 -1px var(--c),-50px 9px 0 -2px #fff; animation:twinkle .25s steps(2) infinite;}
  @keyframes twinkle{50%{opacity:.35; transform:translateY(2px);}}
  .k-bolt i{left:-38px; top:-12px; width:76px; height:24px; background:linear-gradient(90deg,transparent,var(--c) 35%,#fff);
    clip-path:polygon(0 50%,14% 28%,28% 62%,44% 14%,58% 70%,74% 24%,100% 50%,76% 80%,60% 38%,44% 92%,28% 40%,14% 74%); animation:flick .08s steps(2) infinite;}
  @keyframes flick{50%{opacity:.6; transform:scaleY(.8);}}
  .k-slash i{left:-8px; top:-30px; width:40px; height:60px; background:radial-gradient(ellipse 100% 100% at 0% 50%,transparent 60%,#fff 64%,var(--c) 76%,transparent 82%);}
  .k-claw i{left:-24px; top:-22px; width:48px; height:44px;
    background:repeating-linear-gradient(115deg,transparent 0 7px,var(--c) 7px 10px,#fff 10px 11px,transparent 11px 18px);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent); mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);}
  .k-water i{left:-13px; top:-13px; width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#fff 0,var(--c) 45%,transparent 74%);
    box-shadow:-22px 4px 0 -6px var(--c),-36px -3px 0 -8px var(--c); animation:fbPulse .2s linear infinite alternate;}
  .k-water b{right:10px; top:-6px; width:56px; height:12px; border-radius:8px; background:linear-gradient(90deg,transparent,var(--c)); opacity:.5; filter:blur(3px);}
  .k-rock i{left:-15px; top:-15px; width:30px; height:30px; background:radial-gradient(circle at 30% 30%,#d9c3a0,#7a6446 70%,#4a3b27);
    clip-path:polygon(10% 30%,40% 4%,82% 14%,96% 56%,70% 96%,24% 90%,2% 60%); animation:spin .35s linear infinite;}
  .k-rock b{right:12px; top:-8px; width:50px; height:16px; border-radius:50%; background:radial-gradient(ellipse,rgba(190,160,120,.55),transparent 70%);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .k-needle i{left:-14px; top:-2px; width:30px; height:4px; background:linear-gradient(90deg,transparent,var(--c) 45%,#fff); clip-path:polygon(0 0,100% 50%,0 100%);}
  .k-needle i:nth-child(1){transform:translateY(-9px) rotate(-7deg);} .k-needle i:nth-child(3){transform:translateY(9px) rotate(7deg);}
  .k-laser b{left:-70px; top:-3px; width:70px; height:6px; border-radius:3px; background:linear-gradient(90deg,transparent,var(--c) 30%,#fff);}
  .k-laser i{left:-8px; top:-8px; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle,#fff 30%,var(--c) 60%,transparent 72%);}
  .k-star i{left:-14px; top:-14px; width:28px; height:28px; background:radial-gradient(circle,#fff 20%,var(--c) 75%);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); animation:spin .5s linear infinite;}
  .k-star b{right:10px; top:-5px; width:60px; height:10px; border-radius:6px; background:linear-gradient(90deg,transparent,var(--c)); opacity:.5; filter:blur(2px);}
  .k-skull i{left:-14px; top:-16px; font:normal 26px/1 sans-serif; animation:wob .3s ease-in-out infinite alternate;}
  .k-skull b{right:10px; top:-6px; width:60px; height:12px; border-radius:8px; background:linear-gradient(90deg,transparent,#7a3cc9); opacity:.5; filter:blur(3px);}
  @keyframes wob{from{transform:rotate(-12deg);} to{transform:rotate(12deg);}}
  @media (prefers-reduced-motion: reduce){ .fireball i,.boom,.proj i,.proj u{animation:none;} }
  @media (prefers-reduced-motion: reduce){
    .token{transition:none;} .beam,.impact,.token.hit .portrait{animation:none;}
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="duel-online.js"></script>
<div class="wrap">
  <header>
    <h1>Duel Royal</h1>
    <p>Les anciens monstres s'affrontent dans l'arène. Un seul survivra.</p>
  </header>

  <details id="online" class="panel" open hidden>
    <summary>Mode en ligne (hôte)</summary>
    <div id="onLogin" class="row">
      <input type="text" id="onPseudo" placeholder="Pseudo hôte" maxlength="20" autocomplete="username">
      <input type="password" id="onCode" placeholder="Code secret" autocomplete="current-password">
      <button id="onLoginBtn">Connexion</button>
    </div>
    <div class="hint" id="onLoginHint">Crée d'abord ton compte sur parier.html, puis passe-le « hôte » (voir le guide).</div>
    <div id="onPanel" hidden>
      <div class="row"><span id="onWho"></span> <button id="onLogoutBtn" class="ghost">Déconnexion</button></div>
      <div class="row">
        <button id="onOpenBtn">Ouvrir les mises</button>
        <button id="onCancelBtn" class="ghost">Annuler la manche (rembourser)</button>
        <button id="onRetryBtn" hidden>Réessayer l'envoi du résultat</button>
      </div>
      <div id="onState" class="hint" role="status"></div>
      <div class="hint">Lien à donner à tes amis : <b id="onLink"></b></div>
    </div>
  </details>

  <div class="controls">
    <button id="toggleBtn">Lancer le duel</button>
    <button id="restartBtn">Nouvelle bataille</button>
    <label>Vitesse
      <input type="range" id="speed" min="30" max="300" value="100">
    </label>
  </div>

  <div id="status"></div>

  <div id="arena-wrap">
    <div id="arena-field"></div>
    <div id="arena-platform">
      <span class="pylon tl"></span><span class="pylon tr"></span>
      <span class="pylon bl"></span><span class="pylon br"></span>
    </div>
    <div id="arena-custom-bg"></div>
    <div id="fx"></div>
  </div>

  <div id="results" hidden></div>

  <div id="log"></div>
</div>

<script>
/* MonsterSprite v2 : anime automatiquement N'IMPORTE QUELLE image PNG (fond transparent), sans spritesheet.
   Poses : repos, marche, attaque (mêlée 'melee' ou lancer 'cast'), coup reçu, mort.
   Option fly:true -> le monstre VOLE (lévite au-dessus du sol, penche le corps, bat des "ailes" par déformation de maillage).
     const m = new MonsterSprite(img, { size: 74, faces: 'left', fly: true });
     m.setMoving(bool); m.attack('cast'|'melee'); m.hit(); m.die(); m.update(dt); m.draw(ctx, x, yPieds, dir);
     Option rig:[...] -> MARIONNETTE : pièces (tête, mâchoire, aile, queue...) qui bougent chacune avec leur pivot (voir rig_editor.html).
   m.strikeTime() -> secondes avant l'impact de l'attaque ; m.mouthOffset(dir) -> {dx,dy} de la bouche (relatif aux pieds)
*/
class MonsterSprite {
  constructor(img, opts = {}) {
    this.img = img;
    this.size = opts.size || 96;
    this.faces = opts.faces || 'left';
    this.t = opts.phase ?? Math.random() * 6.28;
    this.state = 'idle'; this.stateT = 0; this.moving = false;
    this.flash = 0; this.strikeDone = false; this.onStrike = null;
    this.baseDur = opts.attackDur || 0.55; this.attackDur = this.baseDur; this.atkKind = 'melee';
    this.alive = true; this.src = null;
    this.boxed = opts.boxed;               // true = image avec fond (carte/carré) -> découpée en ovale
    this.deadAlpha = opts.deadAlpha ?? 0;  // opacité finale du cadavre
    this.fly = !!opts.fly;                 // vole
    this.shadow = opts.shadow !== false;   // ombre au sol intégrée
    this.mouth = opts.mouth || { x: 0.32, y: 0.6 }; // bouche : fraction de largeur vers l'avant / de hauteur depuis les pieds
    this.rig = opts.rig || null; this.rigData = null; this.envMove = 0; this.envAtk = 0;
    const build = () => this._build();
    (img.complete && img.naturalWidth) ? build() : img.addEventListener('load', build);
  }
  _build() {
    const w = this.img.naturalWidth, h = this.img.naturalHeight;
    let sx = 0, sy = 0, sw = w, sh = h;
    try {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.drawImage(this.img, 0, 0);
      const d = g.getImageData(0, 0, w, h).data;

const arenaWrap = document.getElementById('arena-wrap');
const fx = document.getElementById('fx');
let fighters = [];
let running = false, settled = false, battleStarted = false;
let rafId = null;
let lastT = 0;
const RADIUS = 30, ATTACK_RANGE = 62, BASE_SPEED = 46, PLATFORM_INSET = 0.07;
if(ARENA_BG){ document.getElementById('arena-custom-bg').style.backgroundImage = `url('${ARENA_BG}')`; }
function platformBounds(){
  const w = arenaWrap.clientWidth, h = arenaWrap.clientHeight;
  return {
    minX: w*PLATFORM_INSET + RADIUS, maxX: w*(1-PLATFORM_INSET) - RADIUS,
    minY: h*PLATFORM_INSET + RADIUS, maxY: h*(1-PLATFORM_INSET) - RADIUS,
  };
}

function portraitHTML(f){
  const hasImg = !!f.img && !f.imgFailed;
  if(hasImg){
    return `<div class="sprbox">
      ${f.alive ? '' : '<div class="ko">K.O.</div>'}
      <canvas class="spr" width="${SPR_CSS*DPR}" height="${SPR_CSS*DPR}"></canvas>
    </div>`;
  }
  return `<div class="portrait" style="--atk-color:${ATTR_COLOR[f.attr]};">
      ${f.alive ? '' : '<div class="ko">K.O.</div>'}
      <span class="icon">${TYPE_ICON[f.type] || '❖'}</span>
    </div>`;
}

function cardHTML(f){
  return `
    ${portraitHTML(f)}
    <div class="hpbar"><div class="hpfill" style="width:${Math.max(0,(f.hp/f.maxHp*100)).toFixed(0)}%"></div></div>

    <div class="tag"><span class="odd">x${ODDS[f.id].odd.toFixed(1)}</span> <span class="bt"></span></div>`;

/* ---- Sprites animés / hologrammes ---- */
const SPR_CSS = 128, SPR_SIZE = 74, FEET = 116;   // SPR_SIZE = taille du monstre à l'écran (px) -> à ajuster
const HOLOGRAM = true;                            // effet hologramme (Duel Disk) ; false = rendu normal
const FLYING_TYPES = ['Dragon', 'Thunder'];       // ces types volent
const RANGED_ALL = true;                          // true = TOUS les monstres attaquent à distance (équitable) ; false = seulement RANGED_TYPES
const RANGED_TYPES = ['Dragon', 'Thunder'];       // utilisé seulement si RANGED_ALL = false
// Style de projectile par type : fireball, darkflame, orb, bolt, slash, claw, water, rock, needle, laser, star, skull
const PROJECTILES = {Dragon:'fireball', Pyro:'fireball', Thunder:'bolt', Spellcaster:'orb', Psychic:'orb', Fiend:'darkflame',
  Warrior:'slash', 'Beast-Warrior':'slash', 'Winged Beast':'slash', Beast:'claw', Insect:'needle', Plant:'needle', Reptile:'needle',
  Machine:'laser', Rock:'rock', Dinosaur:'rock', 'Sea Serpent':'water', Aqua:'water', Fish:'water', Zombie:'skull', Fairy:'star'};
const PROJ_SPEED = {fireball:1, darkflame:.95, orb:1, bolt:2, slash:1.2, claw:1.2, water:.9, rock:.75, needle:1.4, laser:1.8, star:1.1, skull:.8};  // purement visuel : mêmes dégâts pour tous
const ORIGIN_BY_TYPE = {Dragon:null, Thunder:null};   // point de départ du tir : bouche pour les dragons, devant le corps pour les autres
const DEFAULT_ORIGIN = {x:0.36, y:0.55};
const RANGED_RANGE = 100, FIREBALL_SPEED = 560;   // portée des attaques à distance (px) : plus petit = les monstres se rapprochent et bougent plus (mêlée = 62)
const FIREBALL_COLOR = {LIGHT:'#8fd8ff', DARK:'#b26bff', FIRE:'#ff6a3d', WATER:'#4db2ff', EARTH:'#f0a040', WIND:'#6be39a', DIVINE:'#fff2b0'};
const DPR = Math.min(2, window.devicePixelRatio || 1);
const IMG_CACHE = {};
function getImg(src){ if(!IMG_CACHE[src]){ const im = new Image(); im.src = src; IMG_CACHE[src] = im; } return IMG_CACHE[src]; }
function rgba(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function fbColor(f){ return FIREBALL_COLOR[f.attr] || '#ff8a3d'; }

function attachSprite(f){
  f.spr = null; f.moving = false;
  f.fly = f.fly ?? FLYING_TYPES.includes(f.type);
  f.ranged = f.ranged ?? (RANGED_ALL || RANGED_TYPES.includes(f.type));
  f.proj = f.proj || PROJECTILES[f.type] || 'orb';
  f.range = f.ranged ? RANGED_RANGE : ATTACK_RANGE;
  const cv = f.el.querySelector('canvas.spr');
  if(!cv) return;
  const im = getImg(f.img);
  const fail = ()=>{
    f.imgFailed = true; f.spr = null;
    const box = f.el.querySelector('.sprbox');
    if(box) box.outerHTML = portraitHTML(f);
  };
  if(im.complete && !im.naturalWidth){ fail(); return; }
  im.addEventListener('error', fail);
  f.ctx = cv.getContext('2d');
  f.off = document.createElement('canvas'); f.off.width = f.off.height = SPR_CSS * DPR; f.octx = f.off.getContext('2d');
  f.glitchUntil = 0; f.nextGlitch = performance.now() + 1500 + Math.random()*4000;
  const R = (f.rig ? {rig:f.rig} : RIGS[f.img]) || null;   // marionnette éventuelle
  f.spr = new MonsterSprite(im, {size:SPR_SIZE, faces:f.faces || (R && R.faces) || 'left', boxed:f.boxed, deadAlpha:1, fly:f.fly, shadow:false,
                                 mouth:f.mouth || (R && R.mouth) || (f.type in ORIGIN_BY_TYPE ? ORIGIN_BY_TYPE[f.type] : DEFAULT_ORIGIN) || undefined, rig:R && R.rig});
}

// socle du projecteur d'hologramme : cône de lumière + anneaux
function drawBase(c, f, now){
  const col = ATTR_HEX[f.attr] || '#8cf', cx = SPR_CSS/2, rx = SPR_SIZE*0.36, ry = SPR_SIZE*0.09;
  const k = f.alive ? 1 : 0.3, hov = f.spr.hoverH();
  const top = FEET - hov - SPR_SIZE*0.6;
  const g = c.createLinearGradient(0, FEET, 0, top);
  g.addColorStop(0, rgba(col, 0.32*k)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.beginPath();
  c.moveTo(cx-rx, FEET); c.lineTo(cx+rx, FEET); c.lineTo(cx+rx*0.6, top); c.lineTo(cx-rx*0.6, top); c.closePath(); c.fill();
  c.save(); c.globalAlpha = k;
  c.fillStyle = rgba(col, 0.16); c.beginPath(); c.ellipse(cx, FEET, rx, ry, 0, 0, 6.283); c.fill();
  c.strokeStyle = rgba(col, 0.9); c.lineWidth = 2; c.beginPath(); c.ellipse(cx, FEET, rx, ry, 0, 0, 6.283); c.stroke();
  c.setLineDash([6, 8]); c.lineDashOffset = -now*0.02; c.lineWidth = 1.5; c.strokeStyle = rgba(col, 0.6);
  c.beginPath(); c.ellipse(cx, FEET, rx*1.3, ry*1.3, 0, 0, 6.283); c.stroke();
  c.restore();
}
// effet hologramme sur le sprite : teinte, lignes de balayage, barre de scan
function holoFX(f, oc, now){
  const S = SPR_CSS, col = ATTR_HEX[f.attr] || '#8cf';
  oc.save(); oc.setTransform(DPR,0,0,DPR,0,0);
  oc.globalCompositeOperation = 'source-atop';
  const g = oc.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, 'rgba(110,230,255,.34)'); g.addColorStop(1, rgba(col, 0.26));
  oc.fillStyle = g; oc.fillRect(0, 0, S, S);
  const sy = (((now*0.05 + f.id*23) % (S*1.3)) - S*0.15);
  oc.fillStyle = 'rgba(210,255,255,.38)'; oc.fillRect(0, sy, S, 3);
  oc.globalCompositeOperation = 'destination-out'; oc.fillStyle = 'rgba(0,0,0,.24)';
  for(let y = Math.floor(now*0.02) % 3; y < S; y += 3) oc.fillRect(0, y, S, 1);
  oc.restore();
}

let sprLast = performance.now();
function sprLoop(now){
  const dt = Math.min(0.05, (now - sprLast)/1000); sprLast = now;
  const sm = Number(document.getElementById('speed').value) / 100;
  const S = SPR_CSS, W = S*DPR;
  fighters.forEach(f=>{
    if(!f.spr) return;
    const dir = f.facingLeft ? -1 : 1;
    f.spr.setMoving(running && f.alive && f.moving);
    f.spr.update(dt * sm);
    // 1) sprite sur canvas hors-écran (+ effet hologramme)
    const oc = f.octx;
    oc.setTransform(DPR,0,0,DPR,0,0); oc.globalCompositeOperation = 'source-over'; oc.globalAlpha = 1;
    oc.clearRect(0, 0, S, S); oc.imageSmoothingQuality = 'high';
    f.spr.draw(oc, S/2, FEET, dir);
    const holo = HOLOGRAM && f.holo !== false;
    if(holo) holoFX(f, oc, now);
    // 2) composition finale
    const c = f.ctx;
    c.setTransform(1,0,0,1,0,0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.clearRect(0, 0, W, W);
    c.setTransform(DPR,0,0,DPR,0,0);
    if(holo) drawBase(c, f, now);
    else { c.save(); c.globalAlpha = f.alive ? .3 : .1; c.fillStyle = '#000'; c.beginPath(); c.ellipse(S/2, FEET, SPR_SIZE*0.36, SPR_SIZE*0.07, 0, 0, 6.283); c.fill(); c.restore(); }
    c.setTransform(1,0,0,1,0,0);
    if(holo && now > f.nextGlitch){ f.glitchUntil = now + 130; f.nextGlitch = now + 3000 + Math.random()*5000; }
    const glitch = now < f.glitchUntil;
    const a = holo ? 0.9 + 0.06*Math.sin(now*0.03 + f.id*1.7) : 1;
    if(glitch){
      c.globalAlpha = a*0.75; const B = 6, bh = W/B;
      for(let i = 0; i < B; i++){ const dx = (Math.random()-.5) * 14 * DPR * (i%2 ? 1 : .5); c.drawImage(f.off, 0, i*bh, W, bh, dx, i*bh, W, bh); }
    } else { c.globalAlpha = a; c.drawImage(f.off, 0, 0); }
    if(holo){ // halo lumineux
      const z = 1.06; c.setTransform(z,0,0,z, W/2*(1-z), FEET*DPR*(1-z));
      c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.16; c.drawImage(f.off, 0, 0);
      c.setTransform(1,0,0,1,0,0); c.globalCompositeOperation = 'source-over';
    }
    c.globalAlpha = 1;
    // 3) boule de feu qui se charge dans la gueule
    if(f.ranged && f.alive && f.spr.state === 'attack' && f.spr.atkKind === 'cast'){
      const p = Math.min(1, f.spr.stateT / f.spr.strikeTime());
      if(f.spr.stateT < f.spr.strikeTime() + 0.08){
        const m = f.spr.mouthOffset(dir), r = 4 + 15*p, col = fbColor(f);
        c.setTransform(DPR,0,0,DPR,0,0);
        const rg = c.createRadialGradient(S/2 + m.dx, FEET + m.dy, 0, S/2 + m.dx, FEET + m.dy, r*1.8);
        rg.addColorStop(0, '#fff'); rg.addColorStop(0.35, col); rg.addColorStop(1, rgba(col.length === 7 ? col : '#ff8a3d', 0));
        c.globalCompositeOperation = 'lighter'; c.fillStyle = rg;
        c.beginPath(); c.arc(S/2 + m.dx, FEET + m.dy, r*1.8, 0, 6.283); c.fill();
        c.globalCompositeOperation = 'source-over';
      }
    }
  });
  requestAnimationFrame(sprLoop);
}
requestAnimationFrame(sprLoop);

// projectile : DOM animé (Web Animations API) dans la couche #fx
function fireballPath(a, d){
  const dirA = a.facingLeft ? -1 : 1;
  const m = a.spr ? a.spr.mouthOffset(dirA) : {dx: dirA*20, dy: -26};
  const x0 = a.x + m.dx, y0 = a.y + 22 + m.dy;
  const x1 = d.x, y1 = d.y + 22 + (d.spr ? d.spr.bodyOffset() : -26);
  return {x0, y0, x1, y1, dist: Math.hypot(x1-x0, y1-y0)};
}
const PROJ_HTML = {orb:'<b></b><i></i><u></u>', bolt:'<i></i>', slash:'<i></i>', claw:'<i></i>', water:'<b></b><i></i>', rock:'<b></b><i></i>',
                   needle:'<i></i><i></i><i></i>', laser:'<b></b><i></i>', star:'<b></b><i></i>', skull:'<b></b><i>💀</i>'};
function launchProjectile(a, d, ms){
  const kind = a.proj || 'orb';
  const p = fireballPath(a, d), ang = Math.atan2(p.y1-p.y0, p.x1-p.x0)*180/Math.PI;
  const el = document.createElement('div');
  if(kind === 'fireball' || kind === 'darkflame'){
    el.className = 'fireball' + (kind === 'darkflame' ? ' dark' : ''); el.innerHTML = '<b></b><i></i>';
  } else {
    el.className = 'proj k-' + kind; el.innerHTML = PROJ_HTML[kind] || PROJ_HTML.orb;
  }
  el.style.setProperty('--c', fbColor(a));
  fx.appendChild(el);
  const kf = [{transform:`translate(${p.x0}px,${p.y0}px) rotate(${ang}deg)`}, {transform:`translate(${p.x1}px,${p.y1}px) rotate(${ang}deg)`}];
  const ease = (kind === 'laser' || kind === 'bolt') ? 'linear' : 'ease-in';
  if(el.animate) el.animate(kf, {duration: Math.max(80, ms), easing: ease, fill:'forwards'});
  else el.style.transform = kf[1].transform;
  setTimeout(()=>el.remove(), ms + 30);
}
function spawnBoom(x, y, color, kind){
  const b = document.createElement('div'); b.className = 'boom' + (kind ? ' k-' + kind : '');
  b.style.left = x+'px'; b.style.top = y+'px'; b.style.setProperty('--c', color);
  fx.appendChild(b); setTimeout(()=>b.remove(), 520);
  const im = document.createElement('div'); im.className = 'impact';
  im.style.left = x+'px'; im.style.top = y+'px'; im.style.setProperty('--c', color);
  fx.appendChild(im); setTimeout(()=>im.remove(), 340);
}

// Répartit n monstres sans qu'ils se chevauchent (distance mini, resserrée automatiquement si l'arène est petite)
function placeFighters(n, b){
  const w = Math.max(1, b.maxX - b.minX), h = Math.max(1, b.maxY - b.minY);
  let minD = Math.min(130, Math.sqrt(w*h/n) * 0.9);
  const pts = [];
  while(pts.length < n){
    let ok = false;
    for(let t = 0; t < 80 && !ok; t++){
      const x = b.minX + Math.random()*w, y = b.minY + Math.random()*h;
      if(pts.every(p => Math.hypot(p[0]-x, p[1]-y) >= minD)){ pts.push([x, y]); ok = true; }
    }
    if(!ok) minD *= 0.93;
  }
  return pts;
}

function initState(){
  const b = platformBounds();
  fx.innerHTML = '';
  const pts = placeFighters(MONSTERS.length, b);
  const arenaScale = Math.max(0.8, Math.min(1.6, arenaWrap.clientWidth / 1000));   // arène plus grande -> monstres un peu plus rapides
  fighters = MONSTERS.map((m,i)=>{
    const el = document.createElement('div');
    el.className = 'token';
    el.id = 'tok-'+i;
    const f = {
      ...m, id:i, hp:m.atk+m.def, maxHp:m.atk+m.def, alive:true,
      x: pts[i][0], y: pts[i][1],
      speed: (BASE_SPEED + (8 - m.level)*3 + Math.random()*8) * arenaScale,
      cooldown: Math.random()*600, facingLeft:false, el,
    };
    el.innerHTML = cardHTML(f);
    attachSprite(f);
    return f;
  });
  arenaWrap.querySelectorAll('.token').forEach(t=>t.remove());
  fighters.forEach(f=>arenaWrap.appendChild(f.el));
  renderPositions();

  running = false;
  cancelAnimationFrame(rafId);
  document.getElementById('toggleBtn').textContent = 'Lancer le duel';
  document.getElementById('toggleBtn').disabled = false;
  document.getElementById('log').innerHTML = '';
  document.getElementById('status').textContent = MONSTERS.length + ' monstres entrent dans l\'arène.';
  settled = false; battleStarted = false;
  const rs = document.getElementById('results'); rs.hidden = true; rs.innerHTML = '';
}

function renderPositions(){
  fighters.forEach(f=>{
    f.el.style.transform = `translate(${f.x}px, ${f.y}px)`;
    f.el.classList.toggle('dead', !f.alive && !f.dyingVisual);
    f.el.classList.toggle('face-left', f.facingLeft);
  });
}

function logLine(text, isWin){
  const log = document.getElementById('log');
  const div = document.createElement('div');
  if(isWin) div.className = 'win';
  div.textContent = text;
  log.prepend(div);
}

function spawnBeam(a, d, color){
  const dx=d.x-a.x, dy=d.y-a.y, dist=Math.hypot(dx,dy), angle=Math.atan2(dy,dx)*180/Math.PI;
  const beam = document.createElement('div');
  beam.className='beam';
  beam.style.left=a.x+'px'; beam.style.top=a.y+'px'; beam.style.width=dist+'px';
  beam.style.setProperty('--c', color);
  beam.style.transform=`rotate(${angle}deg)`;
  fx.appendChild(beam);
  setTimeout(()=>beam.remove(), 320);

  const impact = document.createElement('div');
  impact.className='impact';
  impact.style.left=d.x+'px'; impact.style.top=d.y+'px';
  impact.style.setProperty('--c', color);
  fx.appendChild(impact);
  setTimeout(()=>impact.remove(), 340);
}

function attack(attacker, defender){
  const variance = 0.75 + Math.random()*0.5;
  const dmg = Math.max(80, Math.round(attacker.atk*variance - defender.def*0.35));
  defender.hp -= dmg;
  logLine(`${attacker.name} attaque ${defender.name} pour ${dmg} dégâts.`);
  const sm = Math.max(0.3, Number(document.getElementById('speed').value) / 100);
  const killed = defender.hp <= 0;
  if(killed){
    defender.hp = 0; defender.alive = false; defender.dyingVisual = true;
    logLine(`💥 ${defender.name} est éliminé !`);
  }
  // délais (ms) : moment de lancement, puis impact visible
  let launch = 0, hitDelay = 0, ranged = false, boomX = 0, boomY = 0;
  if(attacker.ranged){
    ranged = true;
    launch = 300 / sm;
    if(attacker.spr){ attacker.spr.attack('cast'); launch = attacker.spr.strikeTime()*1000 / sm; }
    const travel = fireballPath(attacker, defender).dist / (FIREBALL_SPEED * (PROJ_SPEED[attacker.proj] || 1)) * 1000 / sm;
    setTimeout(()=>launchProjectile(attacker, defender, travel), launch);
    hitDelay = launch + travel;
  } else {
    if(attacker.spr){ attacker.spr.attack(); launch = attacker.spr.strikeTime()*1000 / sm; }
    hitDelay = launch;
    setTimeout(()=>spawnBeam(attacker, defender, ATTR_HEX[attacker.attr] || '#e9cf8f'), launch);
  }
  setTimeout(()=>{
    defender.el.classList.add('hit');
    setTimeout(()=>defender.el.classList.remove('hit'), 250);
    if(ranged){ const p = fireballPath(attacker, defender); spawnBoom(p.x1, p.y1, fbColor(attacker), attacker.proj); }
    if(defender.spr){ defender.alive ? defender.spr.hit() : defender.spr.die(); defender.glitchUntil = performance.now() + 240; }
    defender.dyingVisual = false;
    defender.el.classList.toggle('dead', !defender.alive);
    defender.el.querySelector('.hpfill').style.width = Math.max(0, defender.hp/defender.maxHp*100).toFixed(0)+'%';
    const box = defender.el.querySelector('.sprbox');
    if(box){
      if(!defender.alive && !box.querySelector('.ko')) box.insertAdjacentHTML('beforeend', '<div class="ko">K.O.</div>');
    } else {
      const por = defender.el.querySelector('.portrait');
      if(por) por.innerHTML = (defender.alive ? '' : '<div class="ko">K.O.</div>') + `<span class="icon">${TYPE_ICON[defender.type] || '❖'}</span>`;
    }
  }, hitDelay);
}

function step(t){
  if(!running) return;
  const dt = Math.min(40, t - lastT) / 1000;
  lastT = t;
  const speedMult = Number(document.getElementById('speed').value) / 100;
  const b = platformBounds();
  const alive = fighters.filter(f=>f.alive);

  if(alive.length <= 1){
    running = false;
    const btn = document.getElementById('toggleBtn');
    btn.textContent = 'Lancer le duel'; btn.disabled = true;
    if(alive.length === 1){
      document.getElementById('status').textContent = alive[0].name + ' remporte le duel royal !';
      logLine('🏆 ' + alive[0].name + ' est le dernier debout.', true);
      settled = true;
      if(window.onlineAfterFinish) window.onlineAfterFinish(alive[0].id);
    } else {
      document.getElementById('status').textContent = 'Match nul — plus aucun monstre debout.';
      settled = true;
      if(window.onlineAfterFinish) window.onlineAfterFinish(null);
    }
    return;
  }

  alive.forEach(f=>{
    // find nearest enemy
    let target = null, bestD = Infinity;
    alive.forEach(o=>{
      if(o.id===f.id) return;
      const d = Math.hypot(o.x-f.x, o.y-f.y);
      if(d<bestD){bestD=d; target=o;}
    });
    if(!target) return;
    f.moving = bestD > f.range;

    f.cooldown -= dt*1000*speedMult;

    if(bestD > f.range){
      // seek target + separation from crowd
      let sx = (target.x-f.x)/bestD, sy = (target.y-f.y)/bestD;
      let rx=0, ry=0;
      alive.forEach(o=>{
        if(o.id===f.id) return;
        const d = Math.hypot(o.x-f.x, o.y-f.y);
        if(d < RADIUS*2.1 && d>0.01){ rx += (f.x-o.x)/d/d; ry += (f.y-o.y)/d/d; }
      });
      let dx = sx + rx*18, dy = sy + ry*18;
      const dl = Math.hypot(dx,dy) || 1;
      dx/=dl; dy/=dl;
      f.x += dx * f.speed * speedMult * dt;
      f.y += dy * f.speed * speedMult * dt;
      f.x = Math.max(b.minX, Math.min(b.maxX, f.x));
      f.y = Math.max(b.minY, Math.min(b.maxY, f.y));
      f.facingLeft = dx < 0;
    } else if(f.cooldown <= 0){
      f.facingLeft = target.x < f.x;
      attack(f, target);
      f.cooldown = 700 + Math.random()*400;
    }
  });

  renderPositions();
  const stillAlive = fighters.filter(f=>f.alive).length;
  document.getElementById('status').textContent = stillAlive + ' monstres encore debout.';

  rafId = requestAnimationFrame(step);
}

document.getElementById('toggleBtn').addEventListener('click', async ()=>{
  if(!running && window.onlineBeforeStart){
    const tb = document.getElementById('toggleBtn'); tb.disabled = true;
    const ok = await window.onlineBeforeStart(); tb.disabled = false;
    if(!ok) return;
  }
  running = !running;
  if(running) battleStarted = true;
  document.getElementById('toggleBtn').textContent = running ? 'Mettre en pause' : 'Reprendre';
  if(running){ lastT = performance.now(); rafId = requestAnimationFrame(step); }
  else cancelAnimationFrame(rafId);
});
document.getElementById('restartBtn').addEventListener('click', initState);
window.addEventListener('resize', ()=>{
  const b = platformBounds();
  if(!battleStarted){                       // avant le début : on re-répartit sans chevauchement
    const pts = placeFighters(fighters.length, b);
    fighters.forEach((f,i)=>{ f.x = pts[i][0]; f.y = pts[i][1]; });
  } else fighters.forEach(f=>{ f.x=Math.max(b.minX,Math.min(f.x,b.maxX)); f.y=Math.max(b.minY,Math.min(f.y,b.maxY)); });
  renderPositions();
});

/* ================= COTES ================= */
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('fr-FR');
// Cotes estimées : 800 batailles simulées (mêmes formules de dégâts), cote = 0.9 / probabilité de victoire.
function computeOdds(){
  const N = 800, wins = new Array(MONSTERS.length).fill(0);
  for(let s=0; s<N; s++){
    const hp = MONSTERS.map(m=>m.atk+m.def);
    let alive = MONSTERS.map((_,i)=>i);
    while(alive.length > 1){
      const a = alive[Math.random()*alive.length|0];
      let d; do{ d = alive[Math.random()*alive.length|0]; }while(d===a);
      const dmg = Math.max(80, Math.round(MONSTERS[a].atk*(0.75+Math.random()*0.5) - MONSTERS[d].def*0.35));
      hp[d] -= dmg;
      if(hp[d] <= 0) alive = alive.filter(x=>x!==d);
    }
    wins[alive[0]]++;
  }
  return wins.map(w=>{
    const p = Math.max(w/N, 0.005);
    return {p, odd: Math.min(60, Math.max(1.3, Math.round(0.9/p*10)/10))};
  });
}
const ODDS = computeOdds();

initState();   // premier affichage des monstres

/* ================= MODE EN LIGNE (hôte) ================= */
(function(){
  const DO = window.DuelOnline;
  if(!DO) return;                       // pas configuré -> le jeu reste 100 % local
  const $o = id => document.getElementById(id);
  let me = null, round = null, pendingWinner, poll = null, doneMsg = '';
  $o('online').hidden = false;
  $o('onLink').textContent = location.href.replace(/[^\/]*([?#].*)?$/, '') + 'parier.html';
  const say = t => { $o('onState').textContent = t; };

  function gameIsFresh(){ return !running && !battleStarted && !settled && fighters.every(f=>f.alive); }
  async function sync(){
    try{
      me = await DO.me();
      $o('onLogin').hidden = $o('onLoginHint').hidden = !!me; $o('onPanel').hidden = !me;
      if(!me){ clearInterval(poll); poll = null; return; }
      $o('onWho').innerHTML = '<b>' + esc(me.pseudo) + '</b>' + (me.is_host ? ' · hôte ✔' : ' · <span style="color:var(--fire)">pas hôte</span>');
      round = await DO.activeRound();
      const bets = round ? await DO.bets(round.id) : [];
      const total = bets.reduce((a,b)=>a + b.amount, 0);
      $o('onOpenBtn').disabled = !me.is_host || !!round;
      $o('onCancelBtn').disabled = !me.is_host || !round;
      if(!me.is_host) say("Ce compte n'est pas hôte : exécute la ligne SQL « update players set is_host = true… » (voir le guide).");
      else if(!round) say(pendingWinner !== undefined ? $o('onState').textContent : (doneMsg || "Aucune manche en ligne. « Ouvrir les mises », laisse tes amis parier, puis « Lancer le duel »."));
      else if(round.status === 'open') say(`Mises ouvertes (manche n°${round.id}) — ${bets.length} pari(s), ${fmt(total)} 🪙 en jeu. Clique sur « Lancer le duel » quand tout le monde a misé.`);
      else say(`Bataille en cours (manche n°${round.id}) — mises closes : ${bets.length} pari(s), ${fmt(total)} 🪙. Le résultat sera envoyé automatiquement.`);
      if(!poll) poll = setInterval(()=>{ if(!document.hidden) sync(); }, 4000);
    }catch(e){ say('Erreur de connexion : ' + e.message); }
  }

  $o('onLoginBtn').addEventListener('click', async ()=>{
    try{ await DO.signIn($o('onPseudo').value, $o('onCode').value); $o('onCode').value = ''; await sync(); }
    catch(e){ say(e.message); $o('onLoginHint').textContent = e.message; }
  });
  $o('onLogoutBtn').addEventListener('click', async ()=>{ await DO.signOut(); await sync(); });

  $o('onOpenBtn').addEventListener('click', async ()=>{
    if(!gameIsFresh()) return say("Clique d'abord sur « Nouvelle bataille » : les mises s'ouvrent avant le début du duel.");
    const monsters = MONSTERS.map((m,i)=>({id:String(i), name:m.name, odd:ODDS[i].odd, p:+ODDS[i].p.toFixed(3), img:m.img || null, type:m.type}));
    try{ pendingWinner = undefined; doneMsg = ''; $o('onRetryBtn').hidden = true; await DO.openRound(monsters); await sync(); }
    catch(e){ say('Impossible d\'ouvrir : ' + e.message); }
  });
  $o('onCancelBtn').addEventListener('click', async ()=>{
    if(!round) return;
    if(!confirm('Annuler la manche et rembourser tous les paris ?')) return;
    try{ await DO.cancelRound(round.id); pendingWinner = undefined; doneMsg = 'Manche annulée : tout le monde a été remboursé.'; await sync(); }
    catch(e){ say('Annulation impossible : ' + e.message); }
  });

  // appelé par le bouton « Lancer le duel » : verrouille les mises AVANT que la bataille commence
  window.onlineBeforeStart = async ()=>{
    if(!me) return true;
    try{ round = await DO.activeRound(); }catch(e){ say('Serveur injoignable : ' + e.message); return false; }
    if(!round || round.status !== 'open') return true;
    try{ await DO.lockRound(round.id); $o('online').open = false; await sync(); return true; }
    catch(e){ say('Impossible de verrouiller les mises : ' + e.message); return false; }
  };
  // Résultats affichés sous l'arène (visibles par tes amis si tu partages ton écran)
  async function showResults(r, winnerId){
    const box = document.getElementById('results');
    try{
      const bets = await DO.bets(r.id), name = id => ((r.monsters || []).find(m => m.id === String(id)) || {}).name || '?';
      let html;
      if(winnerId === null) html = '<h2>Match nul</h2><p>Aucun survivant : toutes les mises sont remboursées.</p>';
      else html = `<h2>🏆 ${esc(name(winnerId))} l'emporte !</h2>` + (bets.length ? '<ul>' + bets.map(b => {
        const won = b.monster_id === String(winnerId), delta = won ? (b.payout || 0) - b.amount : b.amount;
        return `<li class="${won ? 'won' : 'lost'}"><b>${esc((b.players || {}).pseudo)}</b> ${won ? 'gagne' : 'perd'} <b>${fmt(Math.abs(delta))}</b> 🪙 <span class="hint">(pari sur ${esc(name(b.monster_id))})</span></li>`;
      }).join('') + '</ul>' : '<p class="hint">Personne n\'avait parié sur cette manche.</p>');
      box.innerHTML = html; box.hidden = false;
    }catch(e){ /* l'affichage des résultats est facultatif */ }
  }
  // appelé à la fin de la bataille : envoie le gagnant, le serveur verse les gains
  async function sendResult(winnerId){
    pendingWinner = winnerId;
    try{
      round = round || await DO.activeRound();
      if(!round || round.status !== 'locked'){ pendingWinner = undefined; return; }
      const closing = round;
      await DO.finishRound(round.id, winnerId === null ? null : String(winnerId));
      $o('online').open = true;
      showResults(closing, winnerId);
      pendingWinner = undefined; $o('onRetryBtn').hidden = true;
      doneMsg = winnerId === null ? '✅ Match nul : les mises ont été remboursées.' : '✅ Manche clôturée : les gains ont été versés.';
    }catch(e){ say('Résultat non envoyé (' + e.message + '). Réessaie avec le bouton.'); $o('onRetryBtn').hidden = false; }
    await sync();
  }
  window.onlineAfterFinish = winnerId => { if(me) sendResult(winnerId); };
  $o('onRetryBtn').addEventListener('click', ()=>{ if(pendingWinner !== undefined) sendResult(pendingWinner); });
  sync();
})();
</script>
